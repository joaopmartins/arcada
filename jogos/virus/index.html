/* ---------- Tamanhos ---------- */
function layout() {
  const root = $('#game'); if (!root || !G.s) return;
  const W = innerWidth, H = innerHeight, land = W > H * 1.05;
  const n = G.s.players.length - 1;
  root.classList.toggle('land', land);
  let hw, bw, ow, dw, cols;
  if (!land) {
    const top = 50;
    hw = Math.min((W - 116) / 3, (H * 0.18) / 1.4, 132);
    bw = Math.min((W - 24) / 5.5, (H * 0.135) / 1.4, 116);
    dw = Math.min(W * 0.13, (H * 0.075) / 1.4, 66);
    const midH = dw * 1.4 + 12, meH = bw * 1.4 * 1.15 + 34, handH = hw * 1.4 + 28;
    const avail = H - top - midH - meH - handH - 12;
    const fit = c => { const rows = Math.ceil(n / c); const ph = avail / rows - 8; return Math.min((W / c - 18) / 5.6, (ph - 50) / 1.58, 96); };
    cols = n >= 2 && fit(2) > fit(1) ? 2 : 1;
    ow = fit(cols);
  } else {
    const top = 46, colW = W * 0.52;
    hw = Math.min((H * 0.3) / 1.4, (W - colW - 116) / 3, 120);
    bw = Math.min((W - colW - 24) / 5.6, (H * 0.27) / 1.4, 104);
    dw = Math.min((H * 0.14) / 1.4, 58);
    const avail = H - top - (dw * 1.4 + 14);
    const fit = c => { const rows = Math.ceil(n / c); const ph = avail / rows - 8; return Math.min((colW / c - 18) / 5.6, (ph - 50) / 1.58, 88); };
    cols = n >= 2 && fit(2) > fit(1) ? 2 : 1;
    ow = fit(cols);
  }
  root.style.setProperty('--hw', Math.floor(hw) + 'px');
  root.style.setProperty('--bw', Math.floor(bw) + 'px');
  root.style.setProperty('--ow', Math.max(22, Math.floor(ow)) + 'px');
  root.style.setProperty('--dw', Math.floor(dw) + 'px');
  root.style.setProperty('--cols', cols);
}

/* ---------- Desenhar o jogo ---------- */
function targetsInfo() {
  const t = { slots: new Set(), opps: new Set(), body: false, button: false };
  if (!G.sel) return t;
  const card = G.s.players[0].hand.find(c => c.id === G.sel.cardId);
  if (!card) return t;
  for (const m of G.moves) {
    const tg = m.target;
    if (card.t === 'organ') t.body = true;
    else if (card.t === 'virus' || card.t === 'med' || card.k === 'thief' || card.k === 'cthief') t.slots.add(tg.oid);
    else if (card.k === 'transplant' || card.k === 'alien') {
      if (!G.sel.first) { t.slots.add(tg.a.oid); t.slots.add(tg.b.oid); }
      else if (tg.a.oid === G.sel.first) t.slots.add(tg.b.oid);
      else if (tg.b.oid === G.sel.first) t.slots.add(tg.a.oid);
    } else if (card.k === 'error') t.opps.add(tg.p);
    else t.button = true;
  }
  return t;
}

function slotHTML(sl, pi, mini, T) {
  const st = ENG.slotState(sl);
  const oid = sl.organ.id;
  let cls = `slot st-${st}`;
  if (T.slots.has(oid)) cls += ' target';
  if (G.sel?.first === oid) cls += ' picked';
  if (G.hint && hintHas(oid)) cls += ' hint';
  let mods = '';
  if (st === 'immune') mods = `<div class="shield">${SHIELD}</div>`;
  else sl.mods.forEach((m, i) => { mods += `<div class="mod mod-${i}">${cardHTML(m, { mini: true })}</div>`; });
  return `<div class="${cls}" data-oid="${oid}" data-pi="${pi}">${cardHTML(sl.organ, { mood: MOOD[st], mini })}${mods}</div>`;
}
function bodyHTML(p, pi, mini, T) {
  let h = '';
  for (const c of ORDER) {
    const sl = p.body.find(x => x.organ.c === c);
    if (sl) h += slotHTML(sl, pi, mini, T);
    else {
      const selC = pi === 0 && T.body && G.s.players[0].hand.find(x => x.id === G.sel.cardId)?.c === c;
      const hintC = pi === 0 && G.hint?.type === 'play' && G.s.players[0].hand.find(x => x.id === G.hint.cardId && x.t === 'organ')?.c === c;
      h += `<div class="ph ph-${c}${selC ? ' target' : ''}${hintC ? ' hint' : ''}" data-ph="${pi}-${c}"></div>`;
    }
  }
  return h;
}
function hintHas(oid) {
  const h = G.hint; if (!h || h.type !== 'play') return false;
  const t = h.target || {};
  return t.oid === oid || t.a?.oid === oid || t.b?.oid === oid;
}
function healthBadge(p) {
  const h = ENG.healthyCount(p.body);
  return `<span class="hb${h >= 3 ? ' hot' : ''}">${'●'.repeat(Math.min(h, 4))}${'○'.repeat(Math.max(0, 4 - h))}</span>`;
}

function render() {
  const s = G.s; if (!s || !$('#game')) return;
  const T = targetsInfo();
  const myTurn = s.turn === 0 && s.winner === null;
  const training = G.cfg.training;
  // adversários
  $('#opps').innerHTML = s.players.slice(1).map((p, i) => {
    const pi = i + 1;
    const hand = training
      ? p.hand.map(c => cardHTML(c, { mini: true, cls: 'hc' })).join('')
      : p.hand.map(() => backHTML('hc')).join('');
    return `<div class="opp${s.turn === pi && s.winner === null ? ' active' : ''}${T.opps.has(pi) ? ' target' : ''}${G.hint?.target?.p === pi && G.hint?.target && !G.hint.target.oid ? ' hint' : ''}" data-opp="${pi}">
      <div class="opp-head"><div class="av">${ART.botFace(p.face)}</div><div class="opp-name">${esc(p.name)}</div>${healthBadge(p)}<div class="opp-hand" data-hand="${pi}">${hand}</div></div>
      <div class="body" data-body="${pi}">${bodyHTML(p, pi, true, T)}</div></div>`;
  }).join('');
  // centro
  const top = s.discard[s.discard.length - 1];
  const lastLog = s.log[s.log.length - 1] || 'Boa sorte!';
  $('#mid').innerHTML = `
    <div class="pile" data-deck>${backHTML()}<span class="cnt">${s.deck.length}</span></div>
    <div class="pile disc${G.discard ? ' target' : ''}" data-discard>${top ? cardHTML(top) : '<div class="empty-pile">Descarte</div>'}</div>
    <button class="logline" data-act="log">${lastLog}</button>`;
  // o meu corpo
  const me = s.players[0];
  $('#me').innerHTML = `
    <div class="me-head"><span class="me-av">${me.avatar}</span><b>${esc(me.name)}</b>${healthBadge(me)}<div class="prompt" id="prompt">${promptHTML(T)}</div></div>
    <div class="body mine${T.body ? ' target' : ''}${myTurn ? ' active' : ''}" data-body="0">${bodyHTML(me, 0, false, T)}</div>`;
  // mão
  $('#handbar').innerHTML = `<div id="hand" class="${myTurn && !G.busy ? 'live' : ''}">${me.hand.map(c => {
    let cls = 'hc';
    if (G.sel?.cardId === c.id) cls += ' sel';
    if (G.discard && G.dsel.has(c.id)) cls += ' dsel';
    if (G.hint && ((G.hint.type === 'play' && G.hint.cardId === c.id) || (G.hint.type === 'discard' && G.hint.cardIds.includes(c.id)))) cls += ' hint';
    return cardHTML(c, { cls });
  }).join('')}</div>
    <div class="hand-acts">${G.discard
      ? `<button class="btn act red" data-act="dconfirm" ${G.dsel.size ? '' : 'disabled'}>🗑️ Deitar fora${G.dsel.size ? ' (' + G.dsel.size + ')' : ''}</button><button class="btn act ghost" data-act="dcancel">Cancelar</button>`
      : `<button class="btn act${G.hint?.type === 'discard' ? ' hint' : ''}" data-act="discard" ${myTurn && !G.busy ? '' : 'disabled'}>🗑️ Descartar</button>`}</div>`;
  // estado
  const st = $('#g-status');
  if (s.winner !== null) st.innerHTML = 'Fim do jogo';
  else if (myTurn) st.innerHTML = `<span class="your">É a tua vez!</span>`;
  else st.innerHTML = `<span class="av-s">${ART.botFace(s.players[s.turn].face)}</span> ${esc(s.players[s.turn].name)} <span class="dots"><i></i><i></i><i></i></span>`;
  const u = $('#b-undo'); if (u) u.disabled = !(myTurn && !G.busy && G.undo.length);
}

function promptHTML(T) {
  const s = G.s;
  if (s.winner !== null || s.turn !== 0) return '';
  if (G.busy) return '';
  if (G.discard) return 'Toca nas cartas que queres deitar fora.';
  if (G.hint) return `💡 ${G.hintText || ''}`;
  if (!G.sel) return G.cfg.tutorial ? 'Toca numa carta para a escolher. Mantém o dedo em cima para saberes o que faz.' : 'Toca numa carta para jogar.';
  const card = s.players[0].hand.find(c => c.id === G.sel.cardId);
  if (!card) return '';
  if (!G.moves.length) return `<span class="warn">${whyNot(card)}</span>`;
  const cor = card.c === 'multi' ? 'de qualquer cor' : TXT.adj[card.c];
  if (card.t === 'organ') return `Toca no teu corpo para pores o ${TXT.organ[card.c]}.`;
  if (card.t === 'virus') return `Toca num órgão ${cor} de um adversário.`;
  if (card.t === 'med') return `Toca num órgão teu ${cor}.`;
  switch (card.k) {
    case 'transplant': case 'alien': return G.sel.first ? 'Agora toca no órgão de outro jogador para trocar.' : 'Toca no primeiro órgão que queres trocar.';
    case 'thief': case 'cthief': return 'Toca no órgão que queres roubar.';
    case 'error': return 'Toca no jogador com quem queres trocar de corpo.';
  }
  return `<button class="btn use" data-act="use">✨ Usar ${esc(shortName(card))}</button>`;
}
function whyNot(card) {
  const me = G.s.players[0];
  if (card.t === 'organ') return `Já tens um ${TXT.organ[card.c]}! Não podes ter dois iguais. Podes descartá-lo.`;
  if (card.t === 'virus') return 'Nenhum adversário tem um órgão onde este vírus funcione.';
  if (card.t === 'med') return me.body.length ? 'Nenhum dos teus órgãos precisa deste remédio.' : 'Ainda não tens órgãos para este remédio.';
  if (card.k === 'ghost') return 'O monte de descarte está vazio.';
  if (card.k === 'cthief' && ENG.hasColor(me.body, card.c)) return `Já tens um ${TXT.organ[card.c]}.`;
  return 'Agora não dá para usar esta carta.';
}

/* ---------- Ciclo de jogo ---------- */
function speed() { return SPEEDS[Prof.get()?.settings.speed || 'normal']; }

async function runLoop() {
  const tok = G.token;
  if (G.running) return;
  G.running = true;
  try {
    const s = G.s;
    while (s.winner === null && tok === G.token) {
      if (s.phase === 'start') {
        const skipped = ENG.beginTurn(s);
        for (const pi of skipped) {
          addLog(pi === 0 ? '🧤 Não tinhas cartas e perdeste a vez.' : `🧤 ${esc(s.players[pi].name)} não tinha cartas e perdeu a vez.`);
          if (pi === 0) toast('🧤 Não tinhas cartas: perdes esta vez e recebes cartas novas.');
        }
        render();
        if (skipped.length) await sleep(speed().after);
      }
      const pi = s.turn;
      if (s.players[pi].isHuman) {
        G.busy = false;
        saveGame();
        render();
        SFX.play('turn');
        banner('É a tua vez!');
        if (G.cfg.tutorial) setTimeout(() => { if (tok === G.token && G.s.turn === 0 && !G.busy) doHint(true); }, 900);
        break;
      }
      G.busy = true;
      render();
      await sleep(speed().think);
      while (G.paused && tok === G.token) await sleep(200);
      if (tok !== G.token) break;
      const mv = AI.choose(s, pi, s.players[pi].level);
      await doMove(pi, mv);
    }
  } finally {
    G.running = false;
  }
  if (tok !== G.token) { if ($('#game') && G.s && G.s.winner === null) runLoop(); return; }
  if (G.s.winner !== null) endGame();
}

async function humanMove(mv) {
  if (G.busy) return;
  G.undo.push(JSON.stringify(G.s));
  if (G.undo.length > 5) G.undo.shift();
  G.sel = null; G.moves = []; G.hint = null; G.discard = false; G.dsel.clear();
  await doMove(0, mv);
  runLoop();
}

function rectOf(sel) { const e = typeof sel === 'string' ? $(sel) : sel; return e ? e.getBoundingClientRect() : null; }
function rectMap() {
  const m = new Map();
  $$('#game [data-oid]').forEach(el => m.set(el.dataset.oid, el.getBoundingClientRect()));
  $$('#hand [data-card]').forEach(el => m.set('h' + el.dataset.card, el.getBoundingClientRect()));
  return m;
}
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

async function flyCard(from, to, html, dur, delay = 0) {
  if (!from || !to || reduced()) return;
  const fx = $('#fx'); if (!fx) return;
  const g = document.createElement('div');
  g.className = 'flyer';
  g.innerHTML = html;
  const w = to.width, h = to.height;
  g.style.cssText = `left:${to.left}px;top:${to.top}px;width:${w}px;height:${h}px;--w:${w}px`;
  fx.appendChild(g);
  const sx = from.width / w;
  const a = g.animate([
    { transform: `translate(${from.left - to.left}px,${from.top - to.top}px) scale(${sx})`, opacity: 1 },
    { transform: `translate(${(from.left - to.left) * 0.4}px,${(from.top - to.top) * 0.4 - 40}px) scale(${(sx + 1) / 2 * 1.15}) rotate(-6deg)`, offset: 0.55 },
    { transform: 'translate(0,0) scale(1)', opacity: 1 }
  ], { duration: dur, delay, easing: 'cubic-bezier(.4,.1,.3,1)', fill: 'both' });
  await a.finished.catch(() => { });
  g.remove();
}

function flip(before, skip) {
  if (reduced()) return;
  $$('#game [data-oid]').forEach(el => {
    const id = el.dataset.oid;
    const r0 = before.get(id);
    if (!r0) {
      if (skip && skip.has(id)) return;
      el.animate([{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1.1)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)' }], { duration: 420, easing: 'ease-out' });
      return;
    }
    const r1 = el.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top, sc = r0.width / r1.width;
    if (Math.abs(dx) + Math.abs(dy) < 2 && Math.abs(sc - 1) < 0.02) return;
    el.style.zIndex = 30;
    el.style.transformOrigin = 'top left';
    const a = el.animate([{ transform: `translate(${dx}px,${dy}px) scale(${sc})` }, { transform: 'none' }],
      { duration: 650, easing: 'cubic-bezier(.5,0,.3,1)' });
    a.onfinish = () => { el.style.zIndex = ''; };
  });
}

function burst(r, text, color = '#ffcc1f', big) {
  if (!r) return;
  const fx = $('#fx'); if (!fx) return;
  const b = document.createElement('div');
  b.className = 'burst' + (big ? ' big' : '');
  const pts = [];
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2, rr = i % 2 ? 34 : 50;
    pts.push((60 + Math.cos(a) * rr * 1.15).toFixed(1) + ',' + (50 + Math.sin(a) * rr * 0.8).toFixed(1));
  }
  b.innerHTML = `<svg viewBox="0 0 120 100"><polygon points="${pts.join(' ')}" fill="${color}" stroke="#1d1330" stroke-width="3" stroke-linejoin="round"/></svg><span>${text}</span>`;
  b.style.left = (r.left + r.width / 2) + 'px';
  b.style.top = (r.top + r.height / 2) + 'px';
  fx.appendChild(b);
  setTimeout(() => b.remove(), 1300);
}
function particles(r, colors, n = 14, spread = 70) {
  if (!r || reduced()) return;
  const fx = $('#fx'); if (!fx) return;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.className = 'pt';
    const size = 6 + Math.random() * 9;
    p.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;width:${size}px;height:${size}px;background:${rnd(colors)}`;
    fx.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = spread * (0.5 + Math.random());
    p.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 30}px)) scale(.3)`, opacity: 0 }],
      { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.4,1)' }).onfinish = () => p.remove();
  }
}
function shakeEl(sel) { const e = typeof sel === 'string' ? $(sel) : sel; if (!e) return; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); setTimeout(() => e.classList.remove('shake'), 600); }
function banner(text) {
  const fx = $('#fx'); if (!fx) return;
  const b = document.createElement('div');
  b.className = 'banner';
  b.textContent = text;
  fx.appendChild(b);
  setTimeout(() => b.remove(), 1400);
}
async function bigCard(card, who) {
  const fx = $('#fx'); if (!fx) return;
  const d = document.createElement('div');
  d.className = 'bigcard';
  d.innerHTML = `<div class="bc-card">${cardHTML(card)}</div><div class="bc-t">${who}</div>`;
  fx.appendChild(d);
  await sleep(speed().big);
  d.classList.add('out');
  await sleep(250);
  d.remove();
}

function addLog(t) {
  G.s.log.push(t);
  if (G.s.log.length > 80) G.s.log.shift();
}
const PCOL = { red: ['#ec4038', '#ff9a8f'], blue: ['#2f86e8', '#9fd0ff'], yellow: ['#f7c51c', '#fff08a'], green: ['#35b84b', '#aef59f'],
  multi: ['#ec4038', '#f7c51c', '#35b84b', '#2f86e8', '#a24fd6'] };

function describe(e) {
  const s = G.s, P = s.players;
  const who = pi => pi === 0 ? '' : esc(P[pi].name) + ' ';
  const V = (pi, tu, ele) => pi === 0 ? cap(tu) : ele;
  const own = (pi, tp, c) => tp === 0 ? (pi === 0 ? `o teu ${TXT.organ[c]}` : `o teu ${TXT.organ[c]}`) : (pi === tp ? `o seu ${TXT.organ[c]}` : `o ${TXT.organ[c]} de ${esc(P[tp].name)}`);
  const orgC = oid => { const f = ENG.findSlot(s, oid); return f ? f.sl.organ.c : 'multi'; };
  switch (e.e) {
    case 'organ': return `🫀 ${who(e.p)}${V(e.p, 'colocaste', 'colocou')} um ${TXT.organ[e.card.c]}.`;
    case 'infect': return `🦠 ${who(e.p)}${V(e.p, 'infetaste', 'infetou')} ${own(e.p, e.tp, orgC(e.oid))}!`;
    case 'destroy': return `💥 ${who(e.p)}${V(e.p, 'destruíste', 'destruiu')} ${own(e.p, e.tp, e.organ.c)}!`;
    case 'neutralize': return `⚡ ${who(e.p)}${V(e.p, 'tiraste', 'tirou')} a vacina d${own(e.p, e.tp, orgC(e.oid))}.`;
    case 'cure': return `💊 ${who(e.p)}${V(e.p, 'curaste', 'curou')} ${own(e.p, e.p, orgC(e.oid))}.`;
    case 'vaccinate': return `💉 ${who(e.p)}${V(e.p, 'vacinaste', 'vacinou')} ${own(e.p, e.p, orgC(e.oid))}.`;
    case 'immune': return `🛡️ ${who(e.p)}${V(e.p, 'imunizaste', 'imunizou')} ${own(e.p, e.p, orgC(e.oid))}!`;
    case 'transplant':
      return `🔁 ${who(e.p)}${V(e.p, 'trocaste', 'trocou')} ${own(e.p, e.a.p, orgC(e.a.oid))} com ${own(e.p, e.b.p, orgC(e.b.oid))}.`;
    case 'steal': return `🦝 ${who(e.p)}${V(e.p, 'roubaste', 'roubou')} ${own(e.p, e.tp, orgC(e.oid))}!`;
    case 'contagion': return e.plan.length ? `🤧 ${who(e.p)}${V(e.p, 'espalhaste', 'espalhou')} ${e.plan.length} vírus!` : `🤧 ${who(e.p)}${V(e.p, 'usaste', 'usou')} Contágio, mas não havia onde pegar os vírus.`;
    case 'glove': return `🧤 ${who(e.p)}${V(e.p, 'usaste', 'usou')} a Luva de Látex! Os outros perdem as cartas.`;
    case 'error': return `🔄 ${who(e.p)}${V(e.p, 'trocaste', 'trocou')} de corpo ${e.tp === 0 ? 'contigo' : 'com ' + esc(P[e.tp].name)}!`;
    case 'ghost': return `👻 ${who(e.p)}${V(e.p, 'foste', 'foi')} buscar uma carta ao descarte.`;
    case 'sneeze': return `🤧 ${who(e.p)}${V(e.p, 'espirraste', 'espirrou')}! Todos passam as cartas ao seguinte.`;
    case 'discard': return `🗑️ ${who(e.p)}${V(e.p, 'deitaste', 'deitou')} fora ${e.n} carta${e.n > 1 ? 's' : ''}.`;
  }
  return '';
}

async function doMove(pi, mv) {
  const s = G.s, sp = speed();
  G.busy = true;
  render();
  const player = s.players[pi];
  const handSrc = id => pi === 0 ? rectOf(`#hand [data-card="${id}"]`) : rectOf(`[data-hand="${pi}"]`);
  let skip = new Set();
  if (mv.type === 'discard') {
    SFX.play('card');
    const dst = rectOf('[data-discard]');
    await Promise.all(mv.cardIds.map((id, i) => {
      const c = player.hand.find(x => x.id === id);
      return flyCard(handSrc(id), dst, cardHTML(c), sp.fly, i * 90);
    }));
  } else {
    const card = player.hand.find(c => c.id === mv.cardId);
    let dst;
    if (card.t === 'organ') { dst = rectOf(`[data-ph="${pi}-${card.c}"]`); skip.add(card.id); }
    else if (card.t === 'virus' || card.t === 'med') dst = rectOf(`[data-oid="${mv.target.oid}"]`);
    else dst = rectOf('[data-discard]');
    SFX.play('card');
    if (card.t === 'treat') {
      await flyCard(handSrc(card.id), dst, cardHTML(card), sp.fly * 0.8);
      await bigCard(card, pi === 0 ? `Usaste: <b>${esc(cardName(card))}</b>` : `${esc(player.name)} usou: <b>${esc(cardName(card))}</b>`);
    } else {
      await flyCard(handSrc(card.id), dst, cardHTML(card), sp.fly);
    }
  }
  const before = rectMap();
  const ev = ENG.applyEffect(s, pi, mv);
  for (const e of ev) addLog(describe(e));
  render();
  flip(before, skip);
  await effects(ev, before);
  await sleep(sp.after);
  // comprar cartas
  const fin = ENG.finishTurn(s, pi, ev);
  const deckR = rectOf('[data-deck]');
  render();
  if (fin.drawn.length) {
    SFX.play('draw');
    if (pi === 0) {
      fin.drawn.forEach((id, i) => {
        const el = $(`#hand [data-card="${id}"]`);
        if (!el || !deckR || reduced()) return;
        const r1 = el.getBoundingClientRect();
        el.animate([{ transform: `translate(${deckR.left - r1.left}px,${deckR.top - r1.top}px) scale(${deckR.width / r1.width}) rotateY(90deg)` },
          { transform: 'none' }], { duration: 420, delay: i * 90, easing: 'ease-out', fill: 'backwards' });
      });
    } else {
      const to = rectOf(`[data-hand="${pi}"]`);
      fin.drawn.forEach((_, i) => flyCard(deckR, to, backHTML(), 300, i * 80));
    }
    await sleep(pi === 0 ? 300 : 200);
  }
  saveGame();
  return fin;
}

async function effects(ev, before) {
  const s = G.s;
  const at = oid => rectOf(`[data-oid="${oid}"]`) || before.get(oid);
  for (const e of ev) {
    const hitsMe = e.tp === 0 && e.p !== 0;
    switch (e.e) {
      case 'organ': SFX.play('organ'); particles(at(e.oid), PCOL[e.card.c], 10, 50); break;
      case 'infect': {
        SFX.play('infect'); const r = at(e.oid);
        shakeEl(`[data-oid="${e.oid}"]`); particles(r, ['#7ddc4a', '#b6f26b', '#3f9e2a'], 16); burst(r, 'DOENTE!', '#9be34a');
        if (hitsMe) buzz(120);
        break;
      }
      case 'destroy': {
        SFX.play('destroy'); const r = before.get(e.oid);
        particles(r, PCOL[e.organ.c].concat(['#1d1330']), 26, 110); burst(r, 'POF!', '#ff6b4a', true);
        if (hitsMe) buzz([80, 40, 160]);
        break;
      }
      case 'neutralize': SFX.play('zap'); burst(at(e.oid), 'ZÁS!', '#ffe14a'); shakeEl(`[data-oid="${e.oid}"]`); break;
      case 'cure': SFX.play('cure'); particles(at(e.oid), ['#fff', '#aef', '#ffe680'], 18); burst(at(e.oid), 'CURADO!', '#7fe0ff'); break;
      case 'vaccinate': SFX.play('vax'); particles(at(e.oid), ['#fff', '#aef'], 10, 50); burst(at(e.oid), 'VACINADO!', '#bdf2ff'); break;
      case 'immune': SFX.play('immune'); particles(at(e.oid), ['#ffcc1f', '#fff6b0', '#fff'], 24, 90); burst(at(e.oid), 'IMUNE!', '#ffcc1f', true); break;
      case 'transplant': SFX.play('swoosh'); await sleep(250); burst(at(e.a.oid), 'TROCA!', '#c6a6ff'); burst(at(e.b.oid), 'TROCA!', '#c6a6ff'); break;
      case 'steal': SFX.play('steal'); await sleep(250); burst(at(e.oid), 'ROUBADO!', '#ff9f43'); if (hitsMe) buzz(150); break;
      case 'contagion':
        SFX.play('infect');
        await Promise.all(e.plan.map((m, i) => {
          const f = before.get(m.from), t = at(m.to);
          const v = ENG.findSlot(s, m.to)?.sl.mods[0];
          return flyCard(f, t, v ? cardHTML(v, { mini: true }) : '', 500, i * 150).then(() => { particles(t, ['#7ddc4a', '#b6f26b'], 10); shakeEl(`[data-oid="${m.to}"]`); });
        }));
        if (e.plan.some(m => m.p === 0)) buzz(120);
        break;
      case 'glove': SFX.play('snap'); burst(rectOf('#opps'), 'SNAP!', '#9fdcff', true); break;
      case 'error': SFX.play('wobble'); await sleep(200); burst(rectOf(`[data-body="${e.p}"]`), 'TROCA!', '#c6a6ff', true); break;
      case 'ghost': SFX.play('ghost'); burst(rectOf('[data-discard]'), 'BUUU!', '#f3f3ff'); break;
      case 'sneeze': SFX.play('sneeze'); burst(rectOf('#mid'), 'ATCHIM!', '#bdf2ff', true); break;
      case 'discard': break;
    }
  }
}

/* ---------- Toques do jogador ---------- */
function myTurnReady() { return G.s && G.s.turn === 0 && G.s.winner === null && !G.busy; }

function onHandCard(id) {
  if (!myTurnReady()) { if (G.s && G.s.turn !== 0) toast('Espera pela tua vez! ⏳', 1200); return; }
  const card = G.s.players[0].hand.find(c => c.id === id); if (!card) return;
  G.hint = null;
  if (G.discard) {
    G.dsel.has(id) ? G.dsel.delete(id) : G.dsel.add(id);
    SFX.play('click'); render(); return;
  }
  if (G.sel?.cardId === id) { G.sel = null; G.moves = []; SFX.play('click'); render(); return; }
  G.sel = { cardId: id };
  G.moves = ENG.movesForCard(G.s, 0, card);
  SFX.play(G.moves.length ? 'select' : 'nope');
  render();
  maybeTip(card);
}
function tipKey(c) { return c.t === 'treat' ? c.k : c.t === 'organ' && c.c === 'multi' ? 'organ-multi' : c.t; }
function maybeTip(card) {
  const p = Prof.get(); if (!p.settings.tips) return;
  const k = tipKey(card); if (p.seen[k]) return;
  p.seen[k] = 1; Store.save();
  showCardInfo(card);
}
function onSlot(oid) {
  if (!G.sel) return false;
  if (!myTurnReady()) return true;
  const card = G.s.players[0].hand.find(c => c.id === G.sel.cardId);
  if (card.k === 'transplant' || card.k === 'alien') {
    if (!G.sel.first) {
      if (G.moves.some(m => m.target.a.oid === oid || m.target.b.oid === oid)) { G.sel.first = oid; SFX.play('select'); render(); }
      else { SFX.play('nope'); shakeEl(`[data-oid="${oid}"]`); }
      return true;
    }
    if (G.sel.first === oid) { G.sel.first = null; render(); return true; }
    const m = G.moves.find(m => (m.target.a.oid === G.sel.first && m.target.b.oid === oid) || (m.target.b.oid === G.sel.first && m.target.a.oid === oid));
    if (m) humanMove({ type: 'play', cardId: card.id, target: { a: { p: ENG.findSlot(G.s, G.sel.first).p, oid: G.sel.first }, b: { p: ENG.findSlot(G.s, oid).p, oid } } });
    else { SFX.play('nope'); shakeEl(`[data-oid="${oid}"]`); }
    return true;
  }
  const m = G.moves.find(m => m.target && m.target.oid === oid);
  if (m) humanMove(m);
  else if (card.t !== 'organ') { SFX.play('nope'); shakeEl(`[data-oid="${oid}"]`); }
  else return false;
  return true;
}
function onBody(pi) {
  if (!G.sel || !myTurnReady()) return;
  const card = G.s.players[0].hand.find(c => c.id === G.sel.cardId);
  if (card.t === 'organ' && pi === 0) {
    if (G.moves.length) humanMove(G.moves[0]);
    else { SFX.play('nope'); shakeEl('#prompt'); }
  }
}
function onOpp(pi) {
  if (!G.sel || !myTurnReady()) return;
  const m = G.moves.find(m => m.target && m.target.p === pi && !m.target.oid);
  if (m) humanMove(m);
}
function doHint(auto) {
  if (!myTurnReady()) return;
  const mv = AI.choose(G.s, 0, 'hard');
  G.hint = mv; G.sel = null; G.moves = []; G.discard = false; G.dsel.clear();
  const s = G.s;
  if (mv.type === 'discard') G.hintText = mv.cardIds.length > 1 ? 'Estas cartas não te servem agora. Descarta-as para receberes novas.' : 'Esta carta não te serve agora. Descarta-a.';
  else {
    const c = s.players[0].hand.find(x => x.id === mv.cardId);
    const t = mv.target || {};
    const P = s.players;
    const org = oid => { const f = ENG.findSlot(s, oid); return f ? TXT.organ[f.sl.organ.c] : ''; };
    if (c.t === 'organ') G.hintText = `Põe o ${TXT.organ[c.c]} no teu corpo.`;
    else if (c.t === 'virus') G.hintText = `Ataca o ${org(t.oid)} de ${esc(P[t.p].name)} com o vírus!`;
    else if (c.t === 'med') G.hintText = `Usa o remédio no teu ${org(t.oid)}.`;
    else if (c.k === 'thief' || c.k === 'cthief') G.hintText = `Rouba o ${org(t.oid)} de ${esc(P[t.p].name)}!`;
    else if (c.k === 'error') G.hintText = `Troca de corpo com ${esc(P[t.p].name)}!`;
    else if (c.k === 'transplant' || c.k === 'alien') G.hintText = `Troca o ${org(t.a.oid)} com o ${org(t.b.oid)}.`;
    else G.hintText = `Usa a carta ${esc(cardName(c))}!`;
  }
  if (!auto) SFX.play('select');
  render();
}

/* ---------- Fim do jogo ---------- */
function endGame() {
  const s = G.s, p = Prof.get();
  const won = s.winner === 0, me = s.players[0];
  const cfg = G.cfg;
  p.save = null;
  const st = p.stats;
  st.played++;
  if (won) { st.wins++; st.streak++; st.best = Math.max(st.best, st.streak); if (!cfg.training) st.fastest = st.fastest ? Math.min(st.fastest, me.st.turns) : me.st.turns; }
  else st.streak = 0;
  const bl = st.byLevel[cfg.level]; bl.p++; if (won) bl.w++;
  for (const k of Object.keys(st.tot)) st.tot[k] += me.st[k] || 0;
  p.history.unshift({ d: Date.now(), won, n: cfg.nOpp, lvl: cfg.level, winner: s.players[s.winner].name, turns: me.st.turns, train: cfg.training });
  p.history = p.history.slice(0, 60);
  if (cfg.tutorial) p.tutorialDone = true;
  const ctx = { won: won && !cfg.training, s, me, P: p, level: cfg.level, nOpp: cfg.nOpp, tutorial: cfg.tutorial };
  const fresh = [];
  for (const m of MEDALS) {
    if (p.medals[m.id]) continue;
    const trainingBlocks = cfg.training && ['first', 'wins10', 'wins50', 'normal', 'hard', 'five', 'clean', 'fast', 'streak3', 'comeback', 'error'].includes(m.id);
    if (!trainingBlocks && m.ok(ctx)) { p.medals[m.id] = Date.now(); fresh.push(m); }
  }
  Store.save();
  render();
  setTimeout(() => {
    SFX.play(won ? 'win' : 'lose');
    if (won) confetti();
    const w = s.players[s.winner];
    modal(`<div class="end ${won ? 'won' : 'lost'}">
      <div class="end-av">${won ? `<span>${me.avatar}</span>` : ART.botFace(w.face)}</div>
      <h1>${won ? 'GANHASTE!' : 'Oh não!'}</h1>
      <p>${won ? (cfg.training ? 'Muito bem! (jogo de treino)' : 'Salvaste o hospital! 🏥') : `${esc(w.name)} completou o corpo primeiro.`}</p>
      <div class="end-body">${bodyHTML(w, -1, true, { slots: new Set(), opps: new Set() })}</div>
      <div class="end-stats">
        <span>🎯 ${pl(me.st.turns, 'jogada', 'jogadas')}</span><span>🦠 ${me.st.virus} vírus</span><span>💊 ${pl(me.st.cure + me.st.vaccinate + me.st.immune, 'remédio', 'remédios')}</span>${me.st.steal ? `<span>🦝 ${pl(me.st.steal, 'roubo', 'roubos')}</span>` : ''}
      </div>
      ${fresh.length ? `<div class="new-medals"><h3>Novas medalhas!</h3>${fresh.map(m => `<div class="nm"><span>${m.icon}</span><b>${m.name}</b></div>`).join('')}</div>` : ''}
      <div class="modal-btns"><button class="btn ghost" data-act="menu">Menu</button><button class="btn primary" data-act="again">Jogar outra vez</button></div>
    </div>`, 'sticky');
    if (fresh.length) setTimeout(() => SFX.play('medal'), 900);
  }, 700);
}
function confetti() {
  if (reduced()) return;
  const cols = ['#ec4038', '#2f86e8', '#f7c51c', '#35b84b', '#a24fd6', '#fff'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('i');
    c.className = 'confetti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${rnd(cols)};width:${6 + Math.random() * 8}px;height:${8 + Math.random() * 10}px`;
    document.body.appendChild(c);
    c.animate([{ transform: `translateY(-5vh) rotate(0)` }, { transform: `translateY(105vh) translateX(${(Math.random() - 0.5) * 30}vw) rotate(${Math.random() * 900}deg)` }],
      { duration: 2200 + Math.random() * 1800, delay: Math.random() * 600, easing: 'cubic-bezier(.3,.2,.6,1)' }).onfinish = () => c.remove();
  }
}

/* ---------- Tutorial ---------- */
function tutorialIntro(done) {
  const slides = [
    { art: ['organ-red', 'organ-blue', 'organ-yellow', 'organ-green'], t: 'O hospital está cheio de vírus! 🦠', d: 'Ganha quem juntar primeiro <b>4 órgãos diferentes e saudáveis</b> no seu corpo.' },
    { art: ['virus-green', 'organ-green-sick'], t: 'Ataca com vírus', d: 'Os vírus deixam os órgãos dos adversários doentes. Com dois vírus, o órgão é destruído!' },
    { art: ['med-red', 'organ-red-immune'], t: 'Protege-te com remédios', d: 'Os remédios curam e vacinam os teus órgãos. Com dois remédios o órgão fica imune para sempre.' },
    { art: ['treat-glove', 'treat-thief'], t: 'Usa tratamentos', d: 'São cartas especiais que roubam, trocam e baralham tudo! Mantém o dedo numa carta para saberes o que faz.' },
    { art: [], t: 'Vamos jogar!', d: 'Neste jogo de treino eu dou-te dicas 💡. Faz o que o balão diz e toca nas cartas que brilham.' }
  ];
  let i = 0;
  const mk = a => { const [t, c, m] = a.split('-'); return t === 'treat' ? cardHTML({ id: 'tu' + a, t, k: c }) : cardHTML({ id: 'tu' + a, t, c }, { mood: m }); };
  const draw = () => {
    const sl = slides[i];
    modal(`<div class="tut">
      <div class="tut-cards">${sl.art.map(mk).join('') || `<div class="tut-big">🎓</div>`}</div>
      <h2>${sl.t}</h2><p>${sl.d}</p>
      <div class="dots-nav">${slides.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="modal-btns">${i ? '<button class="btn ghost" id="tu-b">Voltar</button>' : '<button class="btn ghost" data-act="menu">Sair</button>'}<button class="btn primary" id="tu-n">${i === slides.length - 1 ? 'Começar!' : 'Seguinte →'}</button></div></div>`, 'sticky');
    $('#tu-n').onclick = () => { SFX.play('click'); if (i === slides.length - 1) { closeModal(); done(); } else { i++; draw(); } };
    const b = $('#tu-b'); if (b) b.onclick = () => { SFX.play('click'); i--; draw(); };
  };
  draw();
}

/* ---------- Eventos globais ---------- */
let pressT = null, pressFired = false, pressStart = null;
function findCardAnywhere(id) {
  const s = G.s;
  if (s) {
    for (const p of s.players) {
      const h = p.hand.find(c => c.id === id); if (h) return h;
      for (const sl of p.body) { if (sl.organ.id === id) return sl.organ; const m = sl.mods.find(c => c.id === id); if (m) return m; }
    }
    const d = s.discard.find(c => c.id === id); if (d) return d;
  }
  return null;
}
function cardFromEl(el) {
  const id = el.dataset.card;
  const c = findCardAnywhere(id);
  if (c) return c;
  // cartas de exemplo (regras, definições)
  const m = el.className.match(/t-(\w+) col-(\w+)/);
  if (!m) return null;
  const t = m[1], col = m[2];
  const svgK = id.replace(/^(r|x|tu|d)/, '');
  const kinds = ['cthief', 'transplant', 'thief', 'contagion', 'glove', 'error', 'alien', 'ghost', 'sneeze'];
  const k = kinds.find(k => svgK.includes(k)) || null;
  return { id, t, c: t === 'treat' ? (k === 'cthief' ? (['red', 'blue', 'yellow', 'green'].find(c => svgK.includes(c)) || 'red') : null) : col, k };
}

function bindGlobal() {
  document.addEventListener('pointerdown', e => {
    SFX.unlock();
    const el = e.target.closest('.card[data-card]');
    pressFired = false;
    clearTimeout(pressT);
    if (!el || el.closest('#modal') || el.classList.contains('back')) return;
    pressStart = { x: e.clientX, y: e.clientY };
    pressT = setTimeout(() => {
      const c = cardFromEl(el);
      if (c) { pressFired = true; showCardInfo(c); }
    }, 480);
  });
  document.addEventListener('pointermove', e => {
    if (pressStart && Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > 12) clearTimeout(pressT);
  });
  document.addEventListener('pointerup', () => clearTimeout(pressT));
  document.addEventListener('pointercancel', () => clearTimeout(pressT));
  document.addEventListener('contextmenu', e => { if (e.target.closest('.card')) e.preventDefault(); });

  document.addEventListener('click', e => {
    if (pressFired) { pressFired = false; e.preventDefault(); e.stopPropagation(); return; }
    const t = e.target;
    const act = t.closest('[data-act]');
    if (act && !act.disabled) { onAct(act.dataset.act, act, e); return; }
    // ecrã de preparação e definições
    const opp = t.closest('[data-opp]');
    const inGame = !!t.closest('#game');
    if (!inGame) {
      const p = Prof.get();
      if (opp && t.closest('#seg-opp')) { p.settings.opponents = +opp.dataset.opp; Store.save(); SFX.play('click'); screenSetup(); return; }
      const lv = t.closest('[data-lv]'); if (lv) { p.settings.level = lv.dataset.lv; Store.save(); SFX.play('click'); screenSetup(); return; }
      const sp = t.closest('[data-speed]'); if (sp) { p.settings.speed = sp.dataset.speed; Store.save(); SFX.play('click'); screenSettings(); return; }
      return;
    }
    // no jogo
    const hc = t.closest('#hand .card');
    if (hc) { onHandCard(hc.dataset.card); return; }
    const slot = t.closest('.slot');
    if (slot && onSlot(slot.dataset.oid)) return;
    const body = t.closest('.body.mine');
    if (body) { onBody(0); return; }
    if (opp) { onOpp(+opp.dataset.opp); return; }
    if (t.closest('[data-discard]') && G.sel && myTurnReady()) {
      const card = G.s.players[0].hand.find(c => c.id === G.sel.cardId);
      if (card && G.moves.length && !G.moves[0].target?.oid && !G.moves[0].target?.p && card.t === 'treat' && !['transplant', 'alien', 'error', 'thief', 'cthief'].includes(card.k)) { humanMove(G.moves[0]); return; }
    }
  });
  document.addEventListener('change', e => {
    const p = Prof.get(); if (!p) return;
    const x = e.target.dataset.extra;
    if (x) { p.settings.extras[x] = e.target.checked; e.target.closest('.extra')?.classList.toggle('on', e.target.checked); Store.save(); SFX.play('click'); }
    const sk = e.target.dataset.set;
    if (sk) { p.settings[sk] = e.target.checked; Store.save(); if (sk === 'sound') SFX.set(e.target.checked); SFX.play('click'); }
    if (e.target.id === 'set-train') { p.settings.training = e.target.checked; Store.save(); SFX.play('click'); }
  });
  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if ($('#game')) { layout(); render(); } }, 120); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}

let backTarget = 'menu';
function onAct(a, el) {
  const p = Prof.get();
  if (a !== 'close') SFX.play('click');
  switch (a) {
    case 'pick': Prof.set(el.dataset.id); screenMenu(); break;
    case 'newprof': profileForm(null); break;
    case 'editprof': profileForm(p); break;
    case 'profiles': screenProfiles(); break;
    case 'menu': closeModal(); G.token++; screenMenu(); break;
    case 'setup': screenSetup(); break;
    case 'start': startGame(); break;
    case 'resume': resumeGame(); break;
    case 'tutorial': startGame({ tutorial: true }); break;
    case 'rules': backTarget = 'menu'; screenRules(); break;
    case 'back': if (backTarget === 'game') { enterGame(); } else screenMenu(); break;
    case 'stats': screenStats(); break;
    case 'medals': screenMedals(); break;
    case 'settings': screenSettings(); break;
    case 'close': closeModal(); break;
    case 'again': closeModal(); startGame({ tutorial: false }); break;
    case 'resettips': p.seen = {}; p.settings.tips = true; Store.save(); toast('As explicações vão voltar a aparecer. 👍'); screenSettings(); break;
    case 'resetstats':
      confirmBox('Apagar todas as estatísticas e medalhas de ' + esc(p.name) + '?', () => {
        const fresh = newProfile(p.name, p.avatar, p.color);
        p.stats = fresh.stats; p.history = []; p.medals = {}; Store.save(); toast('Estatísticas apagadas.'); screenSettings();
      });
      break;
    case 'delprof':
      confirmBox('Apagar o jogador ' + esc(p.name) + '? Isto não se pode desfazer.', () => {
        Store.d.profiles = Store.d.profiles.filter(x => x.id !== p.id); Store.d.current = null; Store.save(); screenProfiles();
      });
      break;
    // jogo
    case 'pause':
      G.paused = true;
      modal(`<h2>Pausa ⏸️</h2><div class="menu-btns">
        <button class="btn big primary" data-act="close">▶️ Continuar</button>
        <button class="btn mid" data-act="grules">📖 Regras</button>
        <button class="btn mid" data-act="restart">🔁 Recomeçar</button>
        <button class="btn mid ghost" data-act="menu">🏠 Sair (o jogo fica guardado)</button></div>`);
      G.paused = true;
      break;
    case 'grules': closeModal(); G.token++; backTarget = 'game'; screenRules(); break;
    case 'restart': confirmBox('Recomeçar este jogo?', () => { G.token++; startGame({ tutorial: G.cfg.tutorial }); }); break;
    case 'hint': doHint(false); break;
    case 'undo':
      if (G.undo.length && myTurnReady()) {
        G.s = JSON.parse(G.undo.pop()); G.sel = null; G.hint = null; G.moves = [];
        addLog('↶ Jogada desfeita.'); SFX.play('swoosh'); render(); saveGame();
      }
      break;
    case 'sound': p.settings.sound = !p.settings.sound; SFX.set(p.settings.sound); Store.save(); el.textContent = p.settings.sound ? '🔊' : '🔇'; break;
    case 'discard': if (myTurnReady()) { G.discard = true; G.sel = null; G.hint = null; G.dsel.clear(); render(); } break;
    case 'dcancel': G.discard = false; G.dsel.clear(); render(); break;
    case 'dconfirm': if (G.dsel.size && myTurnReady()) humanMove({ type: 'discard', cardIds: [...G.dsel] }); break;
    case 'use': if (G.moves.length && myTurnReady()) humanMove(G.moves[0]); break;
    case 'log':
      modal(`<h2>O que aconteceu</h2><div class="loglist">${G.s.log.slice().reverse().map(l => `<p>${l}</p>`).join('') || '<p>Ainda nada.</p>'}</div><button class="btn primary wide" data-act="close">Fechar</button>`);
      break;
  }
}
function confirmBox(text, yes) {
  modal(`<h2>Tens a certeza?</h2><p>${text}</p><div class="modal-btns"><button class="btn ghost" data-act="close">Não</button><button class="btn red" id="cf-yes">Sim</button></div>`);
  $('#cf-yes').onclick = () => { closeModal(); yes(); };
}

/* ---------- Arranque ---------- */
function boot() {
  document.body.insertAdjacentHTML('afterbegin', ART.defs());
  Store.load();
  bindGlobal();
  const p = Prof.get();
  if (p) screenMenu(); else screenProfiles();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
