        ctx.beginPath(); ctx.moveTo(o.x + ab, yy); ctx.lineTo(o.x + ab + o.w, yy); ctx.stroke();
      }
    }
  }
  if (o.abanao > 0) o.abanao -= 1 / 60;
}

/* Arbustos: por cima de tudo, para taparem mesmo quem la esta dentro. */
function desenhaArbustos() {
  const tmp = J ? J.tempo : 0;
  for (const o of OBST) {
    if (o.tipo !== 'arbusto') continue;
    ctx.save();
    arredondado(o.x, o.y, o.w, o.h, 14); ctx.clip();
    ctx.fillStyle = '#2d5d38';
    ctx.fillRect(o.x, o.y, o.w, o.h);
    // tufos
    const passo = 22;
    for (let yy = o.y - passo; yy < o.y + o.h + passo; yy += passo * .7) {
      for (let xx = o.x - passo; xx < o.x + o.w + passo; xx += passo) {
        const desl = (Math.floor((yy - o.y) / (passo * .7)) % 2) * passo * .5;
        const bal = Math.sin(tmp * 1.6 + xx * .05 + yy * .03) * 2.2;
        const r = passo * .58;
        ctx.fillStyle = (xx + yy) % 3 === 0 ? '#3f7d52' : '#356b45';
        ctx.beginPath(); ctx.arc(xx + desl + bal, yy, r, 0, 6.2832); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.07)';
        ctx.beginPath(); ctx.arc(xx + desl + bal - r * .3, yy - r * .3, r * .4, 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(20,50,30,.8)'; ctx.lineWidth = 2.5;
    arredondado(o.x, o.y, o.w, o.h, 14); ctx.stroke();
  }
}

function arredondado(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   DESENHO DE PERSONAGENS
   Vista de 3/4 como no Brawl Stars: o corpo esta sempre virado
   para a camara e so o braco da arma roda na direcao da mira.
   Ordem: sombra, pernas, braco de tras, tronco, braco da frente
   com arma, cabeca, adereco, cara.
   ============================================================ */

function escurece(cor, q) {
  // aceita so #rrggbb, que e o que as skins usam
  const n = parseInt(cor.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 255) * (1 - q)) | 0;
  const g = Math.max(0, ((n >> 8) & 255) * (1 - q)) | 0;
  const b = Math.max(0, (n & 255) * (1 - q)) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function desenhaBoneco(c, x, y, raio, corA, corB, ang, opc = {}) {
  if (opc.monstro) desenhaMonstro(c, x, y, raio, corA, corB, ang, opc);
  else desenhaPersonagem(c, x, y, raio, corA, corB, ang, opc);
}

function desenhaPersonagem(c, x, y, R, corA, corB, ang, opc) {
  const v = opc.visual || {};
  const t = opc.tempo || 0;
  const anda = !!opc.anda;
  const passo = anda ? Math.sin(t * 9) : 0;
  const quica = anda ? Math.abs(Math.sin(t * 9)) * R * .06 : 0;
  const pele = corA, roupa = corB;
  const escuro = escurece(corB, .45);
  const temAng = ang !== null && ang !== undefined;

  // larguras conforme o tipo de corpo
  const larg = v.corpo === 'largo' ? 1.22 : (v.corpo === 'magro' ? .82 : 1);
  const troncoL = R * .82 * larg;
  const troncoT = -R * .18;          // topo do tronco
  const troncoB = R * .72;           // base do tronco
  const cabR = R * (v.corpo === 'largo' ? .56 : .6);
  const cabY = troncoT - cabR * .78;

  c.save();
  c.translate(x, y - quica);

  // --- sombra no chao ---
  c.save();
  c.translate(0, R * 1.02 + quica);
  c.scale(1, .3);
  c.fillStyle = 'rgba(0,0,0,.34)';
  c.beginPath(); c.arc(0, 0, R * .88 * larg, 0, 6.2832); c.fill();
  c.restore();

  // --- pernas ---
  const pernaL = R * .26 * larg, pernaY = troncoB;
  const pernaH = R * .34;
  c.fillStyle = escuro;
  for (const lado of [-1, 1]) {
    const bal = passo * lado * R * .16;
    arredondadoEm(c, lado * R * .34 * larg - pernaL / 2, pernaY + Math.max(0, bal),
      pernaL, pernaH - Math.abs(bal) * .3, pernaL * .45);
    c.fill();
    // pe
    c.fillStyle = escurece(corB, .6);
    arredondadoEm(c, lado * R * .34 * larg - pernaL * .62, pernaY + pernaH - Math.abs(bal) * .3 - R * .04,
      pernaL * 1.24, R * .13, R * .06);
    c.fill();
    c.fillStyle = escuro;
  }

  // --- braco de tras (fica atras do tronco) ---
  c.fillStyle = escurece(corA, .25);
  c.beginPath();
  c.arc(-troncoL * .92, troncoT + R * .3 - passo * R * .1, R * .19, 0, 6.2832);
  c.fill();

  // --- tronco ---
  const g = c.createLinearGradient(0, troncoT, 0, troncoB);
  g.addColorStop(0, roupa);
  g.addColorStop(1, escurece(corB, .3));
  c.fillStyle = g;
  c.strokeStyle = 'rgba(0,0,0,.4)';
  c.lineWidth = Math.max(1.6, R * .09);
  arredondadoEm(c, -troncoL, troncoT, troncoL * 2, troncoB - troncoT, R * .28);
  c.fill(); c.stroke();

  // peitilho mais claro, para dar volume
  c.fillStyle = 'rgba(255,255,255,.16)';
  arredondadoEm(c, -troncoL * .5, troncoT + R * .1, troncoL, (troncoB - troncoT) * .5, R * .16);
  c.fill();

  // --- braco da frente com a arma, virado para a mira ---
  if (temAng) {
    c.save();
    c.rotate(ang);
    // ombro -> mao
    c.strokeStyle = escurece(corA, .12);
    c.lineWidth = R * .26;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(R * .1, R * .1);
    c.lineTo(R * .72, 0);
    c.stroke();
    c.lineCap = 'butt';
    // mao
    c.fillStyle = corA;
    c.beginPath(); c.arc(R * .78, 0, R * .2, 0, 6.2832); c.fill();
    desenhaArma(c, R, v.arma, corA, corB, escuro);
    c.restore();
  }

  // --- cabeca ---
  const gc = c.createRadialGradient(-cabR * .3, cabY - cabR * .3, cabR * .2, 0, cabY, cabR * 1.2);
  gc.addColorStop(0, '#fff');
  gc.addColorStop(.35, pele);
  gc.addColorStop(1, escurece(corA, .28));
  c.fillStyle = gc;
  c.strokeStyle = 'rgba(0,0,0,.4)';
  c.lineWidth = Math.max(1.6, R * .09);
  c.beginPath();
  if (v.cabeca === 'quadrada') arredondadoEm(c, -cabR, cabY - cabR, cabR * 2, cabR * 2, cabR * .35);
  else if (v.cabeca === 'pontuda') {
    c.moveTo(0, cabY - cabR * 1.15);
    c.lineTo(cabR, cabY + cabR * .55);
    c.lineTo(-cabR, cabY + cabR * .55);
    c.closePath();
  } else c.arc(0, cabY, cabR, 0, 6.2832);
  c.fill(); c.stroke();

  // --- cara ---
  const olhoX = cabR * .36, olhoY = cabY + cabR * .02, olhoR = cabR * .3;
  const px = temAng ? Math.cos(ang) * olhoR * .42 : 0;
  const py = temAng ? Math.sin(ang) * olhoR * .42 : 0;
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(-olhoX, olhoY, olhoR, 0, 6.2832); c.fill();
  c.beginPath(); c.arc(olhoX, olhoY, olhoR, 0, 6.2832); c.fill();
  c.fillStyle = '#1b1530';
  c.beginPath(); c.arc(-olhoX + px, olhoY + py, olhoR * .52, 0, 6.2832); c.fill();
  c.beginPath(); c.arc(olhoX + px, olhoY + py, olhoR * .52, 0, 6.2832); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.55)';
  c.lineWidth = Math.max(1.4, cabR * .13);
  c.beginPath();
  c.arc(0, cabY + cabR * .34, cabR * .3, .3, Math.PI - .3);
  c.stroke();

  // --- adereco (o que distingue cada heroi) ---
  desenhaAdereco(c, cabR, cabY, v.adereco, corA, corB, escuro);

  c.restore();
}

function desenhaArma(c, R, tipo, corA, corB, escuro) {
  // ja estamos rodados para a mira; a mao esta em (R*.78, 0)
  const X = R * .82;
  c.lineWidth = Math.max(1.4, R * .07);
  c.strokeStyle = 'rgba(0,0,0,.45)';
  switch (tipo) {
    case 'pistola':
      c.fillStyle = escuro;
      arredondadoEm(c, X, -R * .11, R * .62, R * .22, R * .06); c.fill(); c.stroke();
      arredondadoEm(c, X + R * .04, R * .06, R * .16, R * .24, R * .05); c.fill();
      break;
    case 'cacadeira':
      c.fillStyle = escuro;
      arredondadoEm(c, X, -R * .15, R * .85, R * .3, R * .08); c.fill(); c.stroke();
      c.fillStyle = corB;
      arredondadoEm(c, X + R * .62, -R * .19, R * .26, R * .38, R * .07); c.fill(); c.stroke();
      break;
    case 'sniper':
      c.fillStyle = escuro;
      arredondadoEm(c, X, -R * .07, R * 1.15, R * .14, R * .05); c.fill(); c.stroke();
      c.fillStyle = corB;
      arredondadoEm(c, X + R * .2, -R * .22, R * .3, R * .14, R * .05); c.fill();
      break;
    case 'punho':
      c.fillStyle = corB;
      c.beginPath(); c.arc(X + R * .18, 0, R * .3, 0, 6.2832); c.fill(); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,.35)';
      c.beginPath(); c.moveTo(X + R * .04, -R * .14); c.lineTo(X + R * .04, R * .14); c.stroke();
      break;
    case 'martelo':
      c.strokeStyle = escuro; c.lineWidth = R * .13;
      c.beginPath(); c.moveTo(X, 0); c.lineTo(X + R * .62, 0); c.stroke();
      c.fillStyle = '#9aa3ad';
      arredondadoEm(c, X + R * .55, -R * .34, R * .34, R * .68, R * .08); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = Math.max(1.4, R * .07); c.stroke();
      break;
    case 'pa':
      c.strokeStyle = escuro; c.lineWidth = R * .1;
      c.beginPath(); c.moveTo(X, 0); c.lineTo(X + R * .5, 0); c.stroke();
      c.fillStyle = '#c9ccd1';
      c.beginPath();
      c.moveTo(X + R * .45, -R * .26); c.lineTo(X + R * .95, -R * .12);
      c.lineTo(X + R * .95, R * .12); c.lineTo(X + R * .45, R * .26);
      c.closePath(); c.fill(); c.stroke();
      break;
    case 'adaga':
      c.fillStyle = '#d7dce2';
      c.beginPath();
      c.moveTo(X, -R * .08); c.lineTo(X + R * .6, 0); c.lineTo(X, R * .08);
      c.closePath(); c.fill(); c.stroke();
      break;
    case 'garrafa':
      c.fillStyle = corB;
      arredondadoEm(c, X, -R * .2, R * .34, R * .4, R * .1); c.fill(); c.stroke();
      c.fillStyle = escuro;
      arredondadoEm(c, X + R * .3, -R * .09, R * .2, R * .18, R * .05); c.fill();
      break;
    case 'pedra':
      c.fillStyle = '#9c8370';
      c.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * 6.2832;
        const rr = R * (i % 2 ? .2 : .27);
        const px = X + R * .2 + Math.cos(a) * rr, py = Math.sin(a) * rr;
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath(); c.fill(); c.stroke();
      break;
    case 'bastao':
      c.strokeStyle = escuro; c.lineWidth = R * .1;
      c.beginPath(); c.moveTo(X, 0); c.lineTo(X + R * .7, 0); c.stroke();
      c.fillStyle = corA;
      c.beginPath(); c.arc(X + R * .74, 0, R * .17, 0, 6.2832); c.fill();
      break;
    case 'guitarra':
      c.fillStyle = corB;
      c.beginPath(); c.ellipse(X + R * .3, 0, R * .34, R * .26, 0, 0, 6.2832); c.fill(); c.stroke();
      c.strokeStyle = escuro; c.lineWidth = R * .08;
      c.beginPath(); c.moveTo(X + R * .5, 0); c.lineTo(X + R * .95, 0); c.stroke();
      break;
    case 'chave':
      c.fillStyle = '#b9c0c8';
      arredondadoEm(c, X, -R * .09, R * .6, R * .18, R * .05); c.fill(); c.stroke();
      c.beginPath(); c.arc(X + R * .62, 0, R * .17, 0, 6.2832); c.fill(); c.stroke();
      break;
    case 'mina':
      c.fillStyle = '#4a4a55';
      c.beginPath(); c.arc(X + R * .22, 0, R * .24, 0, 6.2832); c.fill(); c.stroke();
      c.fillStyle = '#ff5d5d';
      c.beginPath(); c.arc(X + R * .22, 0, R * .09, 0, 6.2832); c.fill();
      break;
    case 'lampada':
      c.fillStyle = '#ffd60a';
      c.beginPath(); c.ellipse(X + R * .26, 0, R * .3, R * .2, 0, 0, 6.2832); c.fill(); c.stroke();
      c.beginPath();
      c.moveTo(X + R * .5, -R * .06); c.lineTo(X + R * .78, -R * .2); c.lineTo(X + R * .56, R * .04);
      c.closePath(); c.fill(); c.stroke();
      break;
    case 'bola': // bola de demolicao numa corrente
      c.strokeStyle = escuro; c.lineWidth = R * .07;
      c.beginPath(); c.moveTo(X, 0); c.lineTo(X + R * .42, 0); c.stroke();
      c.fillStyle = '#5c636a';
      c.beginPath(); c.arc(X + R * .66, 0, R * .28, 0, 6.2832); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.3)';
      c.beginPath(); c.arc(X + R * .58, -R * .08, R * .09, 0, 6.2832); c.fill();
      break;
    case 'carta': // cartas de tarot
      c.fillStyle = '#f1faee';
      for (let i = 0; i < 3; i++) {
        c.save(); c.rotate((i - 1) * .22);
        arredondadoEm(c, X, -R * .2, R * .38, R * .4, R * .06); c.fill(); c.stroke();
        c.restore();
      }
      c.fillStyle = corB;
      c.beginPath(); c.arc(X + R * .19, 0, R * .07, 0, 6.2832); c.fill();
      break;
    case 'tocha': // tocha acesa
      c.strokeStyle = escuro; c.lineWidth = R * .1;
      c.beginPath(); c.moveTo(X, 0); c.lineTo(X + R * .4, 0); c.stroke();
      c.fillStyle = '#ffba08';
      c.beginPath();
      c.moveTo(X + R * .4, -R * .16); c.lineTo(X + R * .85, 0); c.lineTo(X + R * .4, R * .16);
      c.closePath(); c.fill();
      c.fillStyle = '#ff5400';
      c.beginPath();
      c.moveTo(X + R * .42, -R * .08); c.lineTo(X + R * .66, 0); c.lineTo(X + R * .42, R * .08);
      c.closePath(); c.fill();
      break;
    case 'spray': // pulverizador
      c.fillStyle = corB;
      arredondadoEm(c, X, -R * .17, R * .4, R * .34, R * .08); c.fill(); c.stroke();
      c.fillStyle = escuro;
      arredondadoEm(c, X + R * .36, -R * .07, R * .22, R * .14, R * .04); c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)';
      for (let i = 0; i < 3; i++) {
        c.beginPath(); c.arc(X + R * (.66 + i * .13), (i - 1) * R * .1, R * .05, 0, 6.2832); c.fill();
      }
      break;
    default: break; // 'nada'
  }
}

function desenhaAdereco(c, cabR, cabY, tipo, corA, corB, escuro) {
  c.strokeStyle = 'rgba(0,0,0,.4)';
  c.lineWidth = Math.max(1.3, cabR * .13);
  const topo = cabY - cabR;
  switch (tipo) {
    case 'chapeu': // chapeu de cowboy
      c.fillStyle = escuro;
      c.beginPath(); c.ellipse(0, topo + cabR * .16, cabR * 1.5, cabR * .3, 0, 0, 6.2832); c.fill(); c.stroke();
      arredondadoEm(c, -cabR * .62, topo - cabR * .5, cabR * 1.24, cabR * .72, cabR * .25); c.fill(); c.stroke();
      break;
    case 'bone':
      c.fillStyle = corB;
      c.beginPath(); c.arc(0, topo + cabR * .2, cabR * .95, Math.PI, 0); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(cabR * .7, topo + cabR * .24, cabR * .7, cabR * .18, 0, 0, 6.2832); c.fill();
      break;
    case 'cabelo': // rabo de cavalo de lado
      c.fillStyle = escuro;
      c.beginPath(); c.arc(0, topo + cabR * .34, cabR * 1.02, Math.PI, 0); c.fill();
      c.beginPath(); c.ellipse(cabR * 1.1, cabY + cabR * .15, cabR * .34, cabR * .62, .5, 0, 6.2832); c.fill(); c.stroke();
      break;
    case 'rabos': // dois rabos
      c.fillStyle = escuro;
      c.beginPath(); c.arc(0, topo + cabR * .34, cabR * 1.02, Math.PI, 0); c.fill();
      for (const l of [-1, 1]) {
        c.beginPath(); c.ellipse(l * cabR * 1.15, cabY + cabR * .1, cabR * .3, cabR * .5, l * .4, 0, 6.2832);
        c.fill(); c.stroke();
      }
      break;
    case 'capuz':
      c.fillStyle = corB;
      c.beginPath(); c.arc(0, cabY, cabR * 1.18, Math.PI * 1.08, Math.PI * 1.92); c.fill(); c.stroke();
      break;
    case 'mascara': // mascara de luta livre
      c.fillStyle = corB;
      c.beginPath(); c.arc(0, cabY, cabR * 1.02, Math.PI, 0); c.fill();
      c.beginPath(); c.moveTo(-cabR, cabY); c.lineTo(cabR, cabY);
      c.lineTo(cabR * .5, cabY + cabR * .5); c.lineTo(-cabR * .5, cabY + cabR * .5);
      c.closePath(); c.fill();
      break;
    case 'capacete':
      c.fillStyle = '#ffb703';
      c.beginPath(); c.arc(0, cabY - cabR * .1, cabR * 1.05, Math.PI, 0); c.fill(); c.stroke();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(0, cabY - cabR * .62, cabR * .22, 0, 6.2832); c.fill();
      break;
    case 'cartola':
      c.fillStyle = '#23202e';
      c.beginPath(); c.ellipse(0, topo + cabR * .1, cabR * 1.35, cabR * .26, 0, 0, 6.2832); c.fill(); c.stroke();
      arredondadoEm(c, -cabR * .62, topo - cabR * .95, cabR * 1.24, cabR * 1.05, cabR * .1); c.fill(); c.stroke();
      c.fillStyle = corB;
      arredondadoEm(c, -cabR * .62, topo - cabR * .2, cabR * 1.24, cabR * .22, 0); c.fill();
      break;
    case 'sombrero':
      c.fillStyle = corB;
      c.beginPath(); c.ellipse(0, topo + cabR * .14, cabR * 1.85, cabR * .4, 0, 0, 6.2832); c.fill(); c.stroke();
      c.beginPath(); c.arc(0, topo + cabR * .1, cabR * .72, Math.PI, 0); c.fill(); c.stroke();
      break;
    case 'turbante':
      c.fillStyle = corB;
      c.beginPath(); c.arc(0, topo + cabR * .3, cabR * 1.12, Math.PI, 0); c.fill(); c.stroke();
      c.fillStyle = '#ffd60a';
      c.beginPath(); c.arc(0, topo - cabR * .18, cabR * .2, 0, 6.2832); c.fill();
      break;
    case 'oculos':
      c.fillStyle = 'rgba(30,30,40,.85)';
      arredondadoEm(c, -cabR * 1.02, cabY - cabR * .62, cabR * 2.04, cabR * .42, cabR * .18); c.fill(); c.stroke();
      break;
    case 'antena':
      c.strokeStyle = escuro; c.lineWidth = cabR * .14;
      c.beginPath(); c.moveTo(0, topo); c.lineTo(0, topo - cabR * .7); c.stroke();
      c.fillStyle = '#ff5d5d';
      c.beginPath(); c.arc(0, topo - cabR * .8, cabR * .22, 0, 6.2832); c.fill();
      break;
    case 'bico': // mascara de corvo
      c.fillStyle = '#ffb703';
      c.beginPath();
      c.moveTo(0, cabY + cabR * .1); c.lineTo(cabR * .1, cabY + cabR * .95); c.lineTo(-cabR * .1, cabY + cabR * .95);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = escuro;
      for (const l of [-1, 1]) {
        c.beginPath();
        c.moveTo(l * cabR * .3, topo); c.lineTo(l * cabR * 1.0, topo - cabR * .7); c.lineTo(l * cabR * .85, topo + cabR * .1);
        c.closePath(); c.fill();
      }
      break;
    case 'parafusos':
      c.fillStyle = '#9aa3ad';
      for (const l of [-1, 1]) {
        c.beginPath(); c.arc(l * cabR * 1.08, cabY - cabR * .1, cabR * .22, 0, 6.2832); c.fill(); c.stroke();
      }
      c.fillStyle = escuro;
      arredondadoEm(c, -cabR * .95, topo - cabR * .12, cabR * 1.9, cabR * .38, cabR * .1); c.fill();
      break;
    case 'orelhas':
      c.fillStyle = escuro;
      for (const l of [-1, 1]) {
        c.beginPath(); c.arc(l * cabR * .7, topo + cabR * .1, cabR * .34, 0, 6.2832); c.fill(); c.stroke();
      }
      break;
    case 'espinhos':
      c.fillStyle = corB;
      for (let i = 0; i < 7; i++) {
        const a = Math.PI + (i / 6) * Math.PI;
        c.beginPath();
        c.moveTo(Math.cos(a) * cabR * .9 + Math.cos(a + 1.57) * cabR * .16, cabY + Math.sin(a) * cabR * .9 + Math.sin(a + 1.57) * cabR * .16);
        c.lineTo(Math.cos(a) * cabR * 1.5, cabY + Math.sin(a) * cabR * 1.5);
        c.lineTo(Math.cos(a) * cabR * .9 - Math.cos(a + 1.57) * cabR * .16, cabY + Math.sin(a) * cabR * .9 - Math.sin(a + 1.57) * cabR * .16);
        c.closePath(); c.fill();
      }
      break;
    case 'chapeuFlor':
      c.fillStyle = corB;
      c.beginPath(); c.ellipse(0, topo + cabR * .16, cabR * 1.6, cabR * .32, 0, 0, 6.2832); c.fill(); c.stroke();
      c.beginPath(); c.arc(0, topo + cabR * .1, cabR * .66, Math.PI, 0); c.fill(); c.stroke();
      c.fillStyle = '#ff70a6';
      c.beginPath(); c.arc(cabR * .85, topo, cabR * .24, 0, 6.2832); c.fill();
      break;
    case 'flor':
      c.fillStyle = '#ff70a6';
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * 6.2832;
        c.beginPath();
        c.arc(cabR * .95 + Math.cos(a) * cabR * .2, topo + cabR * .1 + Math.sin(a) * cabR * .2, cabR * .17, 0, 6.2832);
        c.fill();
      }
      c.fillStyle = '#ffe066';
      c.beginPath(); c.arc(cabR * .95, topo + cabR * .1, cabR * .14, 0, 6.2832); c.fill();
      break;
    case 'gorro': // gorro de la com pompom
      c.fillStyle = corB;
      c.beginPath(); c.arc(0, topo + cabR * .28, cabR * 1.05, Math.PI, 0); c.fill(); c.stroke();
      c.fillStyle = escurece(corB, .2);
      arredondadoEm(c, -cabR * 1.05, topo + cabR * .16, cabR * 2.1, cabR * .3, cabR * .1); c.fill();
      c.fillStyle = '#f1faee';
      c.beginPath(); c.arc(0, topo - cabR * .82, cabR * .3, 0, 6.2832); c.fill(); c.stroke();
      break;
    case 'coroa':
      c.fillStyle = '#ffd60a';
      c.beginPath();
      c.moveTo(-cabR * .8, topo + cabR * .1);
      c.lineTo(-cabR * .8, topo - cabR * .55); c.lineTo(-cabR * .3, topo - cabR * .15);
      c.lineTo(0, topo - cabR * .7); c.lineTo(cabR * .3, topo - cabR * .15);
      c.lineTo(cabR * .8, topo - cabR * .55); c.lineTo(cabR * .8, topo + cabR * .1);
      c.closePath(); c.fill(); c.stroke();
      break;
    default: break;
  }
}

/* Os inimigos sao bichos, nao pessoas: silhuetas mais simples e feias. */
function desenhaMonstro(c, x, y, R, corA, corB, ang, opc) {
  const m = opc.monstro;
  const t = opc.tempo || 0;
  const quica = Math.abs(Math.sin(t * 7)) * R * .1;
  const escuro = escurece(corB, .4);
  const temAng = ang !== null && ang !== undefined;

  c.save();
  c.translate(x, y - quica);

  // sombra
  c.save();
  c.translate(0, R * .95 + quica);
  c.scale(1, .3);
  c.fillStyle = 'rgba(0,0,0,.34)';
  c.beginPath(); c.arc(0, 0, R * .9, 0, 6.2832); c.fill();
  c.restore();

  // patas
  c.fillStyle = escuro;
  for (const l of [-1, 1]) {
    const bal = Math.sin(t * 7) * l * R * .14;
    c.beginPath();
    c.ellipse(l * R * .45, R * .8 + bal * .4, R * .2, R * .14, 0, 0, 6.2832);
    c.fill();
  }

  // corpo
  const g = c.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0, corA); g.addColorStop(1, corB);
  c.fillStyle = g;
  c.strokeStyle = 'rgba(0,0,0,.42)';
  c.lineWidth = Math.max(1.8, R * .11);
  c.beginPath();
  if (m === 'caixa') {
    arredondadoEm(c, -R * .92, -R * .8, R * 1.84, R * 1.6, R * .22);
  } else if (m === 'pulga') {
    c.ellipse(0, 0, R * .85, R * 1.02, 0, 0, 6.2832);
  } else if (m === 'chefe') {
    const n = 9;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.2832 - 1.57;
      const rr = R * (i % 2 ? .84 : 1.04);
      i ? c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  } else if (m === 'bruxo') {
    c.moveTo(0, -R * 1.05);
    c.lineTo(R * .92, R * .7);
    c.lineTo(-R * .92, R * .7);
    c.closePath();
  } else { // lesma
    c.ellipse(0, R * .05, R, R * .88, 0, 0, 6.2832);
  }
  c.fill(); c.stroke();

  // brilho
  c.fillStyle = 'rgba(255,255,255,.2)';
  c.beginPath(); c.ellipse(-R * .3, -R * .38, R * .32, R * .2, -.5, 0, 6.2832); c.fill();

  // pormenores por tipo
  if (m === 'lesma') { // antenas
    c.strokeStyle = escuro; c.lineWidth = R * .1;
    for (const l of [-1, 1]) {
      c.beginPath();
      c.moveTo(l * R * .3, -R * .7);
      c.quadraticCurveTo(l * R * .5, -R * 1.2, l * R * .22, -R * 1.35);
      c.stroke();
      c.fillStyle = escuro;
      c.beginPath(); c.arc(l * R * .22, -R * 1.38, R * .12, 0, 6.2832); c.fill();
    }
  } else if (m === 'chefe') { // cornos
    c.fillStyle = '#f1f1f1';
    for (const l of [-1, 1]) {
      c.beginPath();
      c.moveTo(l * R * .55, -R * .78);
      c.lineTo(l * R * .95, -R * 1.35);
      c.lineTo(l * R * .3, -R * .95);
      c.closePath(); c.fill(); c.stroke();
    }
  } else if (m === 'bruxo') { // chapeu pontiagudo
    c.fillStyle = escuro;
    c.beginPath();
    c.moveTo(0, -R * 1.85); c.lineTo(R * .52, -R * .95); c.lineTo(-R * .52, -R * .95);
    c.closePath(); c.fill(); c.stroke();
  } else if (m === 'caixa') { // pregos
    c.fillStyle = escuro;
    for (const lx of [-1, 1]) for (const ly of [-1, 1]) {
      c.beginPath(); c.arc(lx * R * .62, ly * R * .52, R * .1, 0, 6.2832); c.fill();
    }
  }

  // olhos maus
  const olhoR = R * (m === 'chefe' ? .3 : .26);
  const ox = R * .33;
  const oy = m === 'bruxo' ? R * .12 : -R * .08;
  const px = temAng ? Math.cos(ang) * olhoR * .4 : 0;
  const py = temAng ? Math.sin(ang) * olhoR * .4 : 0;
  c.fillStyle = '#fff';
  c.beginPath(); c.arc(-ox, oy, olhoR, 0, 6.2832); c.fill();
  c.beginPath(); c.arc(ox, oy, olhoR, 0, 6.2832); c.fill();
  c.fillStyle = m === 'chefe' ? '#c1121f' : '#1b1530';
  c.beginPath(); c.arc(-ox + px, oy + py, olhoR * .5, 0, 6.2832); c.fill();
  c.beginPath(); c.arc(ox + px, oy + py, olhoR * .5, 0, 6.2832); c.fill();
  // sobrancelhas zangadas
  c.strokeStyle = 'rgba(0,0,0,.6)';
  c.lineWidth = Math.max(1.5, R * .1);
  for (const l of [-1, 1]) {
    c.beginPath();
    c.moveTo(l * ox - l * olhoR * .9, oy - olhoR * 1.35);
    c.lineTo(l * ox + l * olhoR * .5, oy - olhoR * .85);
    c.stroke();
  }
  // boca
  c.beginPath();
  c.arc(0, oy + R * .66, R * .3, Math.PI * 1.15, Math.PI * 1.85);
  c.stroke();

  c.restore();
}

function arredondadoEm(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function desenhaJogo() {
  ctx.save();
  if (J.abalo > 0) ctx.translate(rnd(-J.abalo, J.abalo) * .5, rnd(-J.abalo, J.abalo) * .5);

  desenhaArena();

  // curas
  for (const c of J.curas) {
    const p = Math.sin(J.tempo * 7) * 3;
    ctx.globalAlpha = c.vida < 3 ? (Math.sin(c.vida * 14) > 0 ? .35 : 1) : 1;
    ctx.fillStyle = '#7ed957';
    ctx.beginPath(); ctx.arc(c.x, c.y + p, c.raio, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = '#2d6a1f'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.fillRect(c.x - 7, c.y + p - 2.5, 14, 5);
    ctx.fillRect(c.x - 2.5, c.y + p - 7, 5, 14);
    ctx.globalAlpha = 1;
  }

  // particulas por baixo
  for (const p of J.particulas) {
    const a = p.vida / p.max;
    if (p.onda) {
      const esc = p.escala || 1;
      ctx.strokeStyle = p.cor; ctx.globalAlpha = a * .8; ctx.lineWidth = 8 * a;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * 210 * esc, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.murro) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
      ctx.globalAlpha = a * .55;
      ctx.fillStyle = p.cor;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, p.alcance * (1.25 - a * .35), -p.arcoGolpe, p.arcoGolpe);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1; ctx.restore();
    } else if (p.raio) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
      ctx.globalAlpha = a;
      const gg = ctx.createLinearGradient(0, 0, 900, 0);
      gg.addColorStop(0, p.cor); gg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(0, -16 * a, 900, 32 * a);
      ctx.globalAlpha = 1; ctx.restore();
    }
  }

  // inimigos
  for (const e of J.inimigos) {
    if (e.nascer > 0) {
      const a = 1 - e.nascer / .45;
      ctx.globalAlpha = .55;
      ctx.strokeStyle = e.def.a; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.raio * (1.6 - a * .6), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    // um inimigo dentro de um arbusto fica tapado (o arbusto desenha-se depois)
    if (e.voa) {
      // sombra no chao, porque o corpo vai desenhado mais acima
      ctx.save(); ctx.translate(e.x, e.y + 8); ctx.scale(1, .3);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.arc(0, 0, e.raio * .8, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    const corA = e.flash > 0 ? '#fff' : (e.escudoFlash > 0 ? '#e9ecef' : e.def.a);
    const corB = e.flash > 0 ? '#ffd0d0' : e.def.b;
    if (e.escudoFlash > 0) e.escudoFlash -= 1 / 60;
    desenhaBoneco(ctx, e.x, e.y, e.raio, corA, corB, e.def.longe ? Math.atan2(J.jog.y - e.y, J.jog.x - e.x) : null,
      { monstro: e.def.visual, anda: e.atordoado <= 0, tempo: J.tempo + e.fase });
    if (e.atordoado > 0) {
      // estrelinhas a andar a roda da cabeca
      ctx.fillStyle = '#ffe066';
      for (let i = 0; i < 3; i++) {
        const a = J.tempo * 5 + i * 2.1;
        ctx.beginPath();
        ctx.arc(e.x + Math.cos(a) * e.raio * .8, e.y - e.raio - 10 + Math.sin(a) * 5, 3.2, 0, 6.2832);
        ctx.fill();
      }
    }
    if (e.veneno > 0) {
      ctx.strokeStyle = '#8ac926'; ctx.globalAlpha = .55; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.raio + 5, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // escudo virado ao jogador, para se perceber que ha um lado fraco
    if (e.def.escudo) {
      const olha = Math.atan2(J.jog.y - e.y, J.jog.x - e.x);
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(olha);
      ctx.fillStyle = e.escudoFlash > 0 ? '#fff' : '#ced4da';
      ctx.strokeStyle = '#495057'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(e.raio * .55, 0, e.raio * .95, -1.05, 1.05);
      ctx.lineTo(e.raio * .5, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // o curandeiro mostra a quem esta a dar vida
    if (e.def.cura) {
      ctx.fillStyle = '#95d5b2';
      const p = Math.sin(J.tempo * 6) * 2;
      ctx.fillRect(e.x - 7, e.y - e.raio - 16 + p, 14, 4.5);
      ctx.fillRect(e.x - 2.25, e.y - e.raio - 21 + p, 4.5, 14);
    }
    // o bombista pisca a vermelho, para se perceber que vai rebentar
    if (e.def.explode && Math.sin(J.tempo * 18) > 0) {
      ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.raio + 7, 0, 6.2832); ctx.stroke();
    }

    // barra de vida
    if (e.hp < e.hpMax) {
      const lw = e.raio * 2.1, lx = e.x - lw / 2, ly = e.y - e.raio - 14;
      ctx.fillStyle = 'rgba(0,0,0,.55)'; arredondado(lx, ly, lw, 6, 3); ctx.fill();
      ctx.fillStyle = '#ff5d5d'; arredondado(lx, ly, lw * (e.hp / e.hpMax), 6, 3); ctx.fill();
    }
    if (e.def.chefe) {
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 13px Trebuchet MS'; ctx.textAlign = 'center';
      ctx.fillText('CHEFAO', e.x, e.y - e.raio - 22);
    }
  }

  // campos no chao (veneno do Corvo, espinhos do Espeto)
  for (const cp of J.campos) {
    const a = Math.min(1, cp.vida / 1.2);
    ctx.globalAlpha = .18 * a;
    ctx.fillStyle = cp.cor;
    ctx.beginPath(); ctx.arc(cp.x, cp.y, cp.raio, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = .5 * a;
    ctx.strokeStyle = cp.cor; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cp.x, cp.y, cp.raio, 0, 6.2832); ctx.stroke();
    if (cp.tipo === 'lento') {
      for (let i = 0; i < 9; i++) {
        const an = (i / 9) * 6.2832 + J.tempo * .4;
        const rr = cp.raio * .62;
        ctx.beginPath();
        ctx.moveTo(cp.x + Math.cos(an) * rr, cp.y + Math.sin(an) * rr - 8);
        ctx.lineTo(cp.x + Math.cos(an) * rr - 4, cp.y + Math.sin(an) * rr + 5);
        ctx.lineTo(cp.x + Math.cos(an) * rr + 4, cp.y + Math.sin(an) * rr + 5);
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // minas no chao
  for (const m of J.minas) {
    const pisca = m.vida < 3 || m.persegue;
    const br = pisca && Math.sin(J.tempo * 14) > 0;
    ctx.save(); ctx.translate(m.x, m.y);
    ctx.scale(1, .62);
    ctx.fillStyle = '#3d3d4a';
    ctx.beginPath(); ctx.arc(0, 0, m.raio, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
    ctx.fillStyle = br ? '#ffe066' : '#ff5d5d';
    ctx.beginPath(); ctx.arc(m.x, m.y - m.raio * .25, m.raio * .34, 0, 6.2832); ctx.fill();
    if (m.persegue) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(m.x - m.raio * .35, m.y - m.raio * .1, m.raio * .22, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(m.x + m.raio * .35, m.y - m.raio * .1, m.raio * .22, 0, 6.2832); ctx.fill();
    }
  }

  // torres automaticas
  for (const t of J.torres) {
    if (t.vida < 3 && Math.sin(t.vida * 16) < 0) continue;
    ctx.save(); ctx.translate(t.x, t.y + t.raio * .5); ctx.scale(1, .34);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.arc(0, 0, t.raio, 0, 6.2832); ctx.fill();
    ctx.restore();
    // base
    ctx.fillStyle = escurece(J.skin.b, .3);
    arredondado(t.x - t.raio, t.y - t.raio * .1, t.raio * 2, t.raio * .9, t.raio * .3); ctx.fill();
    // corpo
    ctx.fillStyle = J.skin.a;
    ctx.beginPath(); ctx.arc(t.x, t.y - t.raio * .25, t.raio * .72, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2.5; ctx.stroke();
    // cano virado ao alvo
    ctx.save();
    ctx.translate(t.x, t.y - t.raio * .25);
    ctx.rotate(t.ang || 0);
    ctx.fillStyle = escurece(J.skin.b, .5);
    arredondadoEm(ctx, t.raio * .3, -t.raio * .18, t.raio * .95, t.raio * .36, t.raio * .12); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(t.x, t.y - t.raio * .35, t.raio * .2, 0, 6.2832); ctx.fill();
  }

  // aliados invocados
  for (const al of J.aliados) {
    if (al.vida < 3 && Math.sin(al.vida * 16) < 0) continue; // pisca antes de desaparecer
    desenhaBoneco(ctx, al.x, al.y, al.raio, J.skin.a, J.skin.b, al.ang,
      { visual: { corpo: 'largo', cabeca: 'redonda', adereco: 'orelhas', arma: 'punho' }, anda: true, tempo: J.tempo + al.fase });
    ctx.strokeStyle = J.skin.a; ctx.globalAlpha = .5; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(al.x, al.y, al.raio + 7, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // jogador
  const j = J.jog;
  const piscando = j.invuln > 0 && j.invisivel <= 0 && Math.sin(J.tempo * 40) > 0;
  if (!piscando) {
    const corA = j.flash > 0 ? '#fff' : J.skin.a;
    if (j.alturaSalto > 0) {
      // sombra fica no chao enquanto o corpo esta no ar
      ctx.save(); ctx.translate(j.x, j.y); ctx.scale(1, .34);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.arc(0, 0, j.raio * .8, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    if (j.invisivel > 0) ctx.globalAlpha = .3;
    desenhaBoneco(ctx, j.x, j.y - j.alturaSalto, j.raio, corA, J.skin.b, j.ang,
      { visual: J.heroi.visual, anda: j.alturaSalto <= 0, tempo: J.tempo });
    ctx.globalAlpha = 1;
    if (j.escudo > 0) {
      ctx.strokeStyle = '#8ae9ff';
      ctx.globalAlpha = .45 + Math.sin(J.tempo * 7) * .18;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(j.x, j.y - j.alturaSalto, j.raio + 13, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // balas
  for (const b of J.balas) {
    if (b.arco) {
      // marca no chao onde vai cair, e o projectil por cima
      const p = lim(1 - b.restante / b.total, 0, 1);
      const altura = Math.sin(p * Math.PI) * 46;
      ctx.strokeStyle = b.cor; ctx.globalAlpha = .55; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(b.alvoX, b.alvoY, 8 + p * 12, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = .28; ctx.fillStyle = '#000';
      ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1, .35);
      ctx.beginPath(); ctx.arc(0, 0, b.raio * .8, 0, 6.2832); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(b.x, b.y - altura);
      ctx.rotate(p * 9);
      ctx.fillStyle = b.cor;
      arredondadoEm(ctx, -b.raio, -b.raio * 1.2, b.raio * 2, b.raio * 2.4, b.raio * .5); ctx.fill();
      ctx.strokeStyle = b.cor2; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.restore();
      continue;
    }
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.fillStyle = b.cor2; ctx.globalAlpha = .45;
    ctx.beginPath(); ctx.ellipse(-b.raio * 1.4, 0, b.raio * 2.1, b.raio * .75, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = b.cor;
    ctx.beginPath(); ctx.arc(0, 0, b.raio, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(-b.raio * .2, -b.raio * .25, b.raio * .4, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  // particulas por cima
  for (const p of J.particulas) {
    if (p.onda || p.raio) continue;
    ctx.globalAlpha = p.vida / p.max;
    ctx.fillStyle = p.cor;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // arbustos por cima de tudo, para taparem mesmo quem la esta
  desenhaArbustos();

  // o proprio jogador tem de continuar a ver-se dentro do arbusto (esbatido),
  // senao ficava as escuras. Os inimigos escondidos ficam mesmo tapados.
  if (!piscando && emArbusto(j.x, j.y)) {
    ctx.globalAlpha = .55;
    desenhaBoneco(ctx, j.x, j.y - j.alturaSalto, j.raio, J.skin.a, J.skin.b, j.ang,
      { visual: J.heroi.visual, anda: j.alturaSalto <= 0, tempo: J.tempo });
    ctx.globalAlpha = 1;
    if (j.escondido) {
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.font = 'bold ' + Math.round(H * .020) + 'px Trebuchet MS';
      ctx.textAlign = 'center';
      const txt = 'ESCONDIDO';
      const lw = ctx.measureText(txt).width + 14;
      arredondado(j.x - lw / 2, j.y - j.raio - H * .055, lw, H * .028, 6); ctx.fill();
      ctx.fillStyle = '#b5e48c';
      ctx.fillText(txt, j.x, j.y - j.raio - H * .034);
    }
  }

  // textos flutuantes
  ctx.textAlign = 'center';
  for (const f of J.flutuantes) {
    ctx.globalAlpha = Math.min(1, f.vida * 1.6);
    ctx.font = 'bold 22px Trebuchet MS';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.cor;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
  desenhaHUD();
  desenhaControlos();
}

function desenhaHUD() {
  const j = J.jog;

  // tudo proporcional: a arena muda de tamanho conforme o ecra
  const mg = Math.round(H * 0.030);
  const alt = Math.round(H * 0.047);
  const fonte = n => 'bold ' + Math.round(H * n) + 'px Trebuchet MS';

  // barra de vida
  const bw = Math.round(W * 0.30), bx = mg, by = mg;
  ctx.fillStyle = 'rgba(0,0,0,.45)'; arredondado(bx, by, bw, alt, alt / 2); ctx.fill();
  const frac = Math.max(0, j.hp / j.hpMax);
  const cor = frac > .5 ? '#5ad25a' : (frac > .25 ? '#ffb703' : '#ff4d4d');
  ctx.fillStyle = cor; arredondado(bx + 3, by + 3, (bw - 6) * frac, alt - 6, (alt - 6) / 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = fonte(.025); ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(Math.ceil(j.hp) + ' / ' + j.hpMax, bx + 12, by + alt / 2);

  // barra de super
  const sw = Math.round(W * 0.21), sx = bx + bw + Math.round(W * 0.014);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; arredondado(sx, by, sw, alt, alt / 2); ctx.fill();
  const sf = j.sobrecarga / 100;
  const pronto = sf >= 1;
  ctx.fillStyle = pronto ? (Math.sin(J.tempo * 9) > 0 ? '#ffe066' : '#ffc300') : '#4cc9f0';
  arredondado(sx + 3, by + 3, (sw - 6) * Math.min(1, sf), alt - 6, (alt - 6) / 2); ctx.fill();
  ctx.fillStyle = pronto ? '#14121f' : '#fff'; ctx.font = fonte(.022); ctx.textAlign = 'center';
  ctx.fillText(pronto ? 'SUPER PRONTO!' : J.heroi.superNome.toUpperCase(), sx + sw / 2, by + alt / 2);

  // vaga + trofeus
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ffe066'; ctx.font = fonte(.040);
  ctx.fillText('VAGA ' + Math.max(1, J.vaga), W - mg, by + alt * 0.33);
  ctx.fillStyle = '#fff'; ctx.font = fonte(.023);
  ctx.fillText('🏆 ' + J.trofeusGanhos + '   inimigos: ' + (J.inimigos.length + J.porNascer.length), W - mg, by + alt * 0.95);
  ctx.textBaseline = 'alphabetic';

  // nome do mapa ao entrar nele, com a dica da mecanica
  if (J.avisoMapa > 0) {
    J.avisoMapa -= 1 / 60;
    const a = Math.min(1, J.avisoMapa / .8);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    const cw = Math.min(W * .78, 520), ch = Math.round(H * .13);
    const cy = ARENA.y + ARENA.h * .32;
    ctx.fillStyle = 'rgba(0,0,0,.62)';
    arredondado(W / 2 - cw / 2, cy, cw, ch, 14); ctx.fill();
    ctx.strokeStyle = MAPA.moldura; ctx.lineWidth = 3;
    arredondado(W / 2 - cw / 2, cy, cw, ch, 14); ctx.stroke();
    ctx.fillStyle = '#ffe066'; ctx.font = fonte(.045);
    ctx.textBaseline = 'middle';
    ctx.fillText(MAPA.nome.toUpperCase(), W / 2, cy + ch * .33);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.font = fonte(.024);
    ctx.fillText(MAPA.dica, W / 2, cy + ch * .72);
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }

  // contagem entre vagas
  if (J.porNascer.length === 0 && J.inimigos.length === 0 && J.entreVagas > 0) {
    ctx.textAlign = 'center';
    const cw = Math.min(W * 0.46, 340), ch = Math.round(H * 0.095);
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    arredondado(W / 2 - cw / 2, ARENA.y + ch * 0.5, cw, ch, 14); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.font = fonte(.047);
    ctx.textBaseline = 'middle';
    ctx.fillText('VAGA ' + (J.vaga + 1) + ' EM ' + Math.ceil(J.entreVagas), W / 2, ARENA.y + ch);
    ctx.textBaseline = 'alphabetic';
  }
}

function desenhaControlos() {
  // joysticks so aparecem no toque
  if (eTatil) {
    if (toques.mover) desenhaStick(toques.mover, '#8ae9ff');
    if (toques.mirar) desenhaStick(toques.mirar, '#ffe066');
  }

  // botao de super: sempre visivel, tambem no Mac (e clicavel)
  const b = BOTAO_SUPER, pronto = J.jog.sobrecarga >= 100;
  const bate = pronto ? 1 + Math.sin(J.tempo * 8) * .06 : 1;
  ctx.save();
  ctx.translate(b.x, b.y); ctx.scale(bate, bate);
  ctx.globalAlpha = pronto ? 1 : .38;
  ctx.fillStyle = pronto ? '#ffc300' : '#4a4270';
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = pronto ? '#14121f' : '#fff';
  ctx.font = 'bold ' + Math.round(H * .024) + 'px Trebuchet MS'; ctx.textAlign = 'center';
  ctx.fillText('SUPER', 0, eTatil ? H * .008 : -H * .002);
  if (!eTatil) {
    ctx.font = 'bold ' + Math.round(H * .018) + 'px Trebuchet MS';
    ctx.fillText('SHIFT', 0, H * .024);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
const raioStick = () => H * 0.088;
function desenhaStick(t, cor) {
  const R = raioStick();
  ctx.globalAlpha = .28;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(t.ox, t.oy, R, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = .85;
  const dx = t.x - t.ox, dy = t.y - t.oy, d = Math.hypot(dx, dy);
  const k = d > R ? R / d : 1;
  ctx.fillStyle = cor;
  ctx.beginPath(); ctx.arc(t.ox + dx * k, t.oy + dy * k, R * .46, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------------- ECRAS ---------------- */
const ecras = ['ecraMenu', 'ecraHerois', 'ecraCaixa', 'ecraFim'];
let emJogo = false;
function mostra(id) {
  ecras.forEach(e => document.getElementById(e).classList.toggle('on', e === id));
  emJogo = (id === null);
}
function atualizaMenu() {
  document.getElementById('mTrofeus').textContent = grav.trofeus;
  document.getElementById('mRecorde').textContent = grav.recorde;
  document.getElementById('mEstrelas').textContent = grav.estrelas;
  const n = caixasDisponiveis();
  const bc = document.getElementById('bCaixa');
  bc.style.display = n > 0 ? '' : 'none';
  document.getElementById('nCaixas').textContent = n;
  const falta = TROFEUS_POR_CAIXA - (grav.trofeus % TROFEUS_POR_CAIXA);
  document.getElementById('progCaixa').textContent =
    n > 0 ? 'Tens caixas por abrir!' : 'Faltam ' + falta + ' trofeus para a proxima caixa';
  document.getElementById('comoJogar').textContent = eTatil
    ? 'Lado esquerdo do ecra: mover. Lado direito: apontar e disparar. Botao SUPER em baixo a direita (enche-se ao acertar nos inimigos).'
    : 'WASD ou setas para mover. Rato para apontar, clique ou espaco para disparar. SHIFT ou E para o super (a barra enche-se ao acertar nos inimigos).';
}

/* --- ecra de herois --- */
function desenhaMini(canvas, heroi, skin) {
  const c = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const L = canvas.dataset.lado ? +canvas.dataset.lado : 92;
  canvas.width = L * dpr; canvas.height = L * dpr;
  canvas.style.width = L + 'px'; canvas.style.height = L + 'px';
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, L, L);
  desenhaBoneco(c, L / 2, L / 2 + L * .04, L * 0.26, skin.a, skin.b, -Math.PI / 2, { visual: heroi.visual });
}

function constroiHerois() {
  const g = document.getElementById('grelhaHerois');
  g.innerHTML = '';
  for (const h of HEROIS) {
    const temHeroi = grav.herois.includes(h.id);
    const d = document.createElement('div');
    d.className = 'cartao' + (grav.heroiAtivo === h.id ? ' sel' : '') + (temHeroi ? '' : ' bloq');

    const cn = document.createElement('canvas');
    cn.dataset.lado = 92;
    d.appendChild(cn);
    const skIdx = grav.skinAtiva[h.id] || 0;
    desenhaMini(cn, h, h.skins[skIdx]);

    const nome = document.createElement('div');
    nome.className = 'nome'; nome.textContent = temHeroi ? h.nome : '???';
    d.appendChild(nome);

    const papel = document.createElement('div');
    papel.className = 'papel';
    papel.textContent = temHeroi ? h.papel + ' · ' + h.superNome : 'Abre caixas para desbloquear';
    d.appendChild(papel);

    if (temHeroi) {
      const cores = document.createElement('div');
      cores.className = 'cores';
      h.skins.forEach((s, i) => {
        const temSkin = grav.skins.includes(h.id + ':' + i);
        const b = document.createElement('div');
        b.className = 'cor' + (skIdx === i ? ' sel' : '') + (temSkin ? '' : ' bloq');
        b.style.background = 'linear-gradient(135deg,' + s.a + ',' + s.b + ')';
        b.title = s.nome;
        b.onclick = ev => {
          ev.stopPropagation();
          if (!temSkin) { avisa('Essa cor ainda esta fechada. Abre caixas!'); return; }
          grav.skinAtiva[h.id] = i; grav.heroiAtivo = h.id; guarda(); constroiHerois();
        };
        cores.appendChild(b);
      });
      d.appendChild(cores);
      d.onclick = () => { grav.heroiAtivo = h.id; guarda(); constroiHerois(); };
    } else {
      const cad = document.createElement('div');
      cad.className = 'cadeado'; cad.textContent = '🔒';
      d.appendChild(cad);
      d.onclick = () => avisa('Este heroi vem dentro de uma caixa!');
    }
    g.appendChild(d);
  }
  const h = heroiPorId(grav.heroiAtivo);
  avisa('Escolhido: ' + h.nome + ' (' + h.hp + ' de vida, super: ' + h.superNome + ')');
}
let avisoTimer = null;
function avisa(txt) {
  const el = document.getElementById('avisoHerois');
  el.textContent = txt;
  clearTimeout(avisoTimer);
}

/* --- caixas --- */
function poolFechado() {
  const p = [];
  for (const h of HEROIS) {
    if (!grav.herois.includes(h.id)) p.push({ tipo: 'heroi', heroi: h, peso: 5 });
  }
  for (const h of HEROIS) {
    if (!grav.herois.includes(h.id)) continue;
    h.skins.forEach((s, i) => {
      if (!grav.skins.includes(h.id + ':' + i)) p.push({ tipo: 'skin', heroi: h, skin: s, idx: i, peso: 2 });
    });
  }
  return p;
}
let premioAtual = null;
function abreCaixa() {
  const arte = document.getElementById('caixaArte');
  const prem = document.getElementById('caixaPremio');
  document.getElementById('bAbrir').style.display = 'none';
  arte.classList.add('abana');
  Som.toca(300, .1, 'square', .04);
  setTimeout(() => Som.toca(340, .1, 'square', .04), 180);
  setTimeout(() => Som.toca(380, .1, 'square', .04), 360);

  setTimeout(() => {
    arte.classList.remove('abana');
    arte.textContent = '✨';
    grav.caixasAbertas++;

    const pool = poolFechado();
    let tipo = 'estrela', txt = '+1 Estrela', sub = 'PREMIO';
    let heroi = heroiPorId(grav.heroiAtivo), skin = heroi.skins[grav.skinAtiva[heroi.id] || 0];

    if (pool.length) {
      const total = pool.reduce((s, p) => s + p.peso, 0);
      let r = Math.random() * total, esc = pool[0];
      for (const p of pool) { r -= p.peso; if (r <= 0) { esc = p; break; } }
      if (esc.tipo === 'heroi') {
        grav.herois.push(esc.heroi.id);
        grav.heroiAtivo = esc.heroi.id;
        sub = 'HEROI NOVO!'; txt = esc.heroi.nome;
        heroi = esc.heroi; skin = esc.heroi.skins[0];
      } else {
        grav.skins.push(esc.heroi.id + ':' + esc.idx);
        sub = 'COR NOVA PARA ' + esc.heroi.nome.toUpperCase();
        txt = esc.skin.nome;
        heroi = esc.heroi; skin = esc.skin;
      }
    } else {
      grav.estrelas++;
      sub = 'JA TENS TUDO!'; txt = '+1 Estrela ⭐';
    }
    guarda();

    const cnPremio = document.getElementById('premioArte');
    cnPremio.dataset.lado = 120;
    desenhaMini(cnPremio, heroi, skin);
    document.getElementById('premioTipo').textContent = sub;
    document.getElementById('premioTitulo').textContent = txt;
    prem.style.display = 'flex';
    document.getElementById('bFecharCaixa').style.display = '';
    Som.premio();
  }, 1250);
}

/* --- fim de jogo --- */
function terminaJogo() {
  if (J.acabou) return;
  J.acabou = true;
  Som.fim();
  const vagas = Math.max(0, J.vaga - 1);
  grav.trofeus += J.trofeusGanhos;
  if (vagas > grav.recorde) grav.recorde = vagas;
  guarda();
  setTimeout(() => {
    document.getElementById('fVaga').textContent = vagas;
    document.getElementById('fGanhos').textContent = J.trofeusGanhos;
    document.getElementById('fimTitulo').textContent = vagas >= grav.recorde && vagas > 0 ? 'NOVO RECORDE!' : 'FIM DE JOGO';
    const n = caixasDisponiveis();
    document.getElementById('fimNota').textContent = n > 0
      ? 'Ganhaste ' + n + (n === 1 ? ' caixa' : ' caixas') + ' para abrir no menu!'
      : 'Faltam ' + (TROFEUS_POR_CAIXA - (grav.trofeus % TROFEUS_POR_CAIXA)) + ' trofeus para a proxima caixa.';
    mostra('ecraFim');
  }, 900);
}

/* ---------------- LIGACOES DOS BOTOES ---------------- */
function arranca() {
  Som.garante();
  // o pedido de ecra inteiro so e aceite durante um toque/clique do utilizador
  if (eTatil && ecraInteiroDisponivel() && !(document.fullscreenElement || document.webkitFullscreenElement)) {
    alternaEcraInteiro();
    setTimeout(redimensiona, 250);
  }
  novoJogo();
  mostra(null);
}

};

/* ---------------- CICLO PRINCIPAL ---------------- */
let ultimo = performance.now();
function ciclo(agora) {
  let dt = (agora - ultimo) / 1000;
  ultimo = agora;
  if (dt > .05) dt = .05; // evita saltos gigantes ao voltar de outro separador

  if (emJogo && J) {
    atualiza(dt);
    desenhaJogo();
  } else {
    // fundo tranquilo por tras dos menus
    desenhaArena();
  }
  requestAnimationFrame(ciclo);
}

/* Guarda o jogo no telemovel para funcionar sem rede. So corre quando servido
   por http(s): aberto por duplo-clique (file://) nao ha service workers, mas
   tambem nao e preciso, o ficheiro ja esta no disco. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* sem isto joga-se na mesma */ });
  });
}

/* ---------------- ARRANQUE ---------------- */
carrega();
redimensiona();
atualizaMenu();
requestAnimationFrame(ciclo);
</script>
