<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Super Trunfo dos Monstros</title>
<meta name="description" content="Jogo de cartas de Halloween contra o computador.">
<meta name="theme-color" content="#140821">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monstros">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#140821; --bg2:#25103f; --panel:#2c1348; --panel2:#3a1b5e;
    --ink:#f6edff; --muted:#c3a7e6; --line:rgba(255,255,255,.12);
    --orange:#ff8a1e; --orange2:#ffb45a; --purple:#9a5cff; --green:#6ee86e;
    --red:#ff5a6a; --gold:#ffd24a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink); background:
      radial-gradient(900px 600px at 15% -10%, #3a1860 0%, transparent 55%),
      radial-gradient(800px 700px at 110% 0%, #5a1d2e 0%, transparent 50%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    background-attachment:fixed; overflow:hidden; user-select:none;
    touch-action:manipulation;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 10px);
    max-width:620px; margin:0 auto}
  .scr{display:none; flex:1; min-height:0; flex-direction:column}
  .scr.on{display:flex}

  /* ---------- Título ---------- */
  #title{align-items:center; justify-content:center; text-align:center; gap:4px}
  .moon{font-size:58px; filter:drop-shadow(0 0 18px rgba(255,210,74,.5))}
  h1{margin:6px 0 0; font-size:clamp(30px,8.5vw,46px); line-height:1.02; font-weight:900;
    background:linear-gradient(90deg,var(--orange),var(--gold),var(--orange2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .tsub{color:var(--muted); font-size:14px; margin:8px 0 18px; max-width:300px; line-height:1.4}
  .big{border:0; cursor:pointer; font-family:inherit; font-weight:900;
    color:#241; background:linear-gradient(180deg,var(--orange2),var(--orange));
    padding:16px 40px; border-radius:18px; font-size:22px;
    box-shadow:0 8px 0 #b85c00, 0 14px 22px rgba(0,0,0,.35)}
  .big:active{transform:translateY(5px); box-shadow:0 3px 0 #b85c00}
  .tlinks{display:flex; gap:10px; margin-top:16px}
  .ghostbtn{border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--ink);
    font-family:inherit; font-weight:700; padding:10px 16px; border-radius:12px; font-size:14px; cursor:pointer}
  .ghostbtn:active{transform:scale(.96)}

  /* ---------- HUD ---------- */
  #hud{display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .score{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:8px 10px; display:flex; align-items:center; gap:8px}
  .score .av{font-size:22px}
  .score .nm{font-size:11px; color:var(--muted); line-height:1}
  .score .ct{font-size:20px; font-weight:900; line-height:1}
  .score.you{border-color:rgba(110,232,110,.45)}
  .score.bot{border-color:rgba(255,90,106,.45)}
  .pot{min-width:64px; text-align:center; background:var(--panel2); border:1px solid var(--line);
    border-radius:14px; padding:6px 8px}
  .pot .ct{font-size:19px; font-weight:900; color:var(--gold); line-height:1}
  .pot .nm{font-size:10px; color:var(--muted)}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:18px; cursor:pointer; flex:0 0 auto}
  .iconbtn:active{transform:scale(.92)}

  /* ---------- Zona do bot ---------- */
  #botzone{display:flex; justify-content:center; align-items:center; min-height:0; flex:0 0 auto; margin-bottom:4px}
  .minicard{width:120px; border-radius:14px; border:2px solid var(--line); overflow:hidden;
    background:var(--panel); position:relative}
  .back{height:150px; display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(45deg,#3a1b5e 0 10px,#2c1348 10px 20px);
    font-size:46px; filter:drop-shadow(0 0 8px rgba(154,92,255,.6))}
  .mini-art{display:block; width:100%; height:92px; background:#1b0e2e}
  .mini-name{font-size:11px; font-weight:800; text-align:center; padding:4px 2px 2px; line-height:1}
  .mini-rows{padding:2px 6px 6px; font-size:11px}
  .mini-rows .r{display:flex; justify-content:space-between; padding:1px 0; color:var(--muted)}
  .mini-rows .r b{color:var(--ink)}
  .mini-rows .r.hit{color:#fff}
  .mini-rows .r.hit b{color:var(--gold)}

  /* ---------- Mensagem ---------- */
  #msg{text-align:center; font-weight:800; font-size:15px; min-height:22px; padding:2px 6px;
    line-height:1.25}
  #msg .win{color:var(--green)} #msg .lose{color:var(--red)} #msg .tie{color:var(--gold)}

  /* ---------- A tua carta ---------- */
  #youzone{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:2px solid var(--purple);
    border-radius:20px; padding:10px; box-shadow:0 10px 26px rgba(0,0,0,.4);
    display:flex; flex-direction:column; min-height:0}
  .card .cname{font-size:18px; font-weight:900; text-align:center; margin:0 0 6px}
  .art{width:100%; flex:1; min-height:90px; border-radius:14px; background:#1b0e2e; display:block}
  .attrs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
  .attr{display:flex; align-items:center; gap:8px; border:2px solid var(--line);
    background:rgba(255,255,255,.05); border-radius:14px; padding:10px 12px; cursor:pointer;
    font-family:inherit; color:var(--ink); text-align:left}
  .attr .em{font-size:22px}
  .attr .al{flex:1}
  .attr .al .k{font-size:12px; color:var(--muted); line-height:1}
  .attr .al .v{font-size:22px; font-weight:900; line-height:1.1}
  .attr.pick{border-color:var(--orange); background:rgba(255,138,30,.16)}
  .attr:disabled{opacity:.6; cursor:default}
  .attr.go{animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,138,30,0)}50%{box-shadow:0 0 0 4px rgba(255,138,30,.35)}}
  .bar{display:flex; gap:10px; margin-top:8px}
  .bar .big{flex:1; padding:14px; font-size:19px; border-radius:16px}
  .hint{text-align:center; color:var(--muted); font-size:12px; margin-top:6px; min-height:14px}

  /* ---------- Fim ---------- */
  #over{align-items:center; justify-content:center; text-align:center; gap:6px}
  #overEmo{font-size:70px}
  #overTitle{font-size:30px; font-weight:900; margin:4px}
  #overSub{color:var(--muted); font-size:15px; margin-bottom:10px}
  .tro{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:6px 0 16px; max-width:360px}
  .trb{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
    font-size:13px; display:flex; align-items:center; gap:6px}
  .trb.new{border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,210,74,.3)}

  /* ---------- Modal troféus ---------- */
  #troScr{align-items:center; justify-content:center}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:18px;
    max-width:380px; width:100%}
  .panel h2{margin:0 0 12px; font-size:22px; text-align:center}
  .tlist{display:flex; flex-direction:column; gap:10px; margin-bottom:14px}
  .ti{display:flex; gap:12px; align-items:center; padding:10px; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid var(--line)}
  .ti.locked{opacity:.45}
  .ti .ic{font-size:26px}
  .ti .tx .t{font-weight:800; font-size:14px}
  .ti .tx .d{font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<div id="app">

  <!-- TÍTULO -->
  <section id="title" class="scr on">
    <div class="moon">🎃</div>
    <h1>Super Trunfo<br>dos Monstros</h1>
    <div class="tsub">Escolhe um poder da tua carta. Quem tiver o número maior ganha as duas cartas. Fica com todas para venceres!</div>
    <button class="big" id="playBtn">Jogar 🦇</button>
    <div class="tlinks">
      <button class="ghostbtn" id="howBtn">Como se joga</button>
      <button class="ghostbtn" id="troBtn">🏆 Troféus</button>
      <button class="ghostbtn" id="muteBtn">🔊 Som</button>
    </div>
  </section>

  <!-- JOGO -->
  <section id="game" class="scr">
    <div id="hud">
      <div class="score you"><span class="av">🧑</span><div><div class="nm">Tu</div><div class="ct" id="youCt">0</div></div></div>
      <div class="pot"><div class="ct" id="potCt">0</div><div class="nm">no monte</div></div>
      <div class="score bot"><span class="av">👹</span><div><div class="nm">Bot</div><div class="ct" id="botCt">0</div></div></div>
      <button class="iconbtn" id="muteBtn2">🔊</button>
    </div>

    <div id="botzone"></div>
    <div id="msg"></div>

    <div id="youzone">
      <div class="card">
        <div class="cname" id="yName">Carta</div>
        <canvas class="art" id="yArt"></canvas>
        <div class="attrs" id="attrs"></div>
      </div>
      <div class="hint" id="hint"></div>
      <div class="bar" id="bar" style="display:none">
        <button class="big" id="contBtn">Continuar ▶</button>
      </div>
    </div>
  </section>

  <!-- FIM -->
  <section id="over" class="scr">
    <div id="overEmo">🏆</div>
    <div id="overTitle">Ganhaste!</div>
    <div id="overSub"></div>
    <div class="tro" id="overTro"></div>
    <button class="big" id="againBtn">Jogar outra vez</button>
    <button class="ghostbtn" id="homeBtn" style="margin-top:12px">Menu</button>
  </section>

  <!-- TROFÉUS -->
  <section id="troScr" class="scr">
    <div class="panel">
      <h2>🏆 Troféus</h2>
      <div class="tlist" id="troList"></div>
      <button class="big" id="troClose" style="width:100%">Voltar</button>
    </div>
  </section>

</div>

<script>
"use strict";
/* ============================ SOM ============================ */
const SFX = (()=>{
  let ctx=null, on=true;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(f,t,type,vol,when){
    if(!on) return; const c=ac(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain(), s=c.currentTime+(when||0);
    o.type=type||"square"; o.frequency.setValueAtTime(f,s);
    g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(vol||0.2,s+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,s+t);
    o.connect(g).connect(c.destination); o.start(s); o.stop(s+t+0.02);
  }
  return {
    setOn(v){on=v;}, isOn(){return on;}, resume(){const c=ac(); if(c&&c.state==="suspended")c.resume();},
    tap(){tone(420,0.07,"square",0.15);},
    pick(){tone(600,0.08,"triangle",0.2); tone(820,0.09,"triangle",0.18,0.06);},
    win(){tone(540,0.1,"square",0.2); tone(720,0.12,"square",0.2,0.1); tone(960,0.16,"square",0.2,0.22);},
    lose(){tone(300,0.14,"sawtooth",0.18); tone(200,0.2,"sawtooth",0.16,0.12);},
    tie(){tone(440,0.1,"sine",0.18); tone(440,0.1,"sine",0.18,0.14);},
    victory(){[523,659,784,1047].forEach((f,i)=>tone(f,0.22,"square",0.2,i*0.14));},
    defeat(){[440,370,294,247].forEach((f,i)=>tone(f,0.26,"sawtooth",0.17,i*0.16));}
  };
})();

/* ============================ ARTE DOS MONSTROS ============================ */
// cada funcao desenha em coordenadas CSS; cx,cy centro; s = escala
function shadow(g,cx,cy,s){ g.save(); g.globalAlpha=.22; g.fillStyle="#000";
  g.beginPath(); g.ellipse(cx,cy+78*s,52*s,12*s,0,0,7); g.fill(); g.restore(); }
function eye(g,x,y,r,pr,look){ g.fillStyle="#fff"; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  g.fillStyle="#1a1a1a"; g.beginPath(); g.arc(x+(look||0),y,pr,0,7); g.fill(); }
function fang(g,x,y,w,h){ g.fillStyle="#fff"; g.beginPath(); g.moveTo(x-w,y); g.lineTo(x+w,y); g.lineTo(x,y+h); g.closePath(); g.fill(); }

const ART = {
  fantasminha(g,cx,cy,s){ shadow(g,cx,cy,s);
    g.fillStyle="#f3f0ff"; g.beginPath(); g.arc(cx,cy-10*s,46*s,Math.PI,0);
    g.lineTo(cx+46*s,cy+40*s);
    for(let i=0;i<4;i++){ g.lineTo(cx+46*s-(i*2+1)*11.5*s, cy+40*s+(i%2?-14*s:0)); }
    g.lineTo(cx-46*s,cy+40*s); g.closePath(); g.fill();
    eye(g,cx-16*s,cy-10*s,9*s,5*s); eye(g,cx+16*s,cy-10*s,9*s,5*s);
    g.fillStyle="#1a1a1a"; g.beginPath(); g.ellipse(cx,cy+14*s,7*s,10*s,0,0,7); g.fill(); },

  abobora(g,cx,cy,s){ shadow(g,cx,cy,s);
    g.fillStyle="#2f7d2f"; g.fillRect(cx-5*s,cy-58*s,10*s,18*s);
    g.fillStyle="#ff8a1e"; for(let d=-1;d<=1;d++){ g.beginPath(); g.ellipse(cx+d*26*s,cy+4*s,30*s,44*s,0,0,7); g.fill(); }
    g.beginPath(); g.ellipse(cx,cy+4*s,40*s,46*s,0,0,7); g.fill();
    g.fillStyle="#3a1b00";
    g.beginPath(); g.moveTo(cx-24*s,cy-14*s); g.lineTo(cx-6*s,cy-4*s); g.lineTo(cx-24*s,cy+2*s); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(cx+24*s,cy-14*s); g.lineTo(cx+6*s,cy-4*s); g.lineTo(cx+24*s,cy+2*s); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(cx-26*s,cy+22*s);
    [[-16,10],[-8,22],[0,12],[8,22],[16,10],[26,22]].forEach(p=>g.lineTo(cx+p[0]*s,cy+p[1]*s));
    g.lineTo(cx-26*s,cy+22*s); g.fill(); },

  morcego(g,cx,cy,s){ shadow(g,cx,cy,s); g.fillStyle="#40235f";
    g.beginPath(); g.arc(cx,cy,26*s,0,7); g.fill();
    g.beginPath(); g.moveTo(cx-18*s,cy-22*s); g.lineTo(cx-10*s,cy-40*s); g.lineTo(cx-4*s,cy-24*s); g.fill();
    g.beginPath(); g.moveTo(cx+18*s,cy-22*s); g.lineTo(cx+10*s,cy-40*s); g.lineTo(cx+4*s,cy-24*s); g.fill();
    // asas
    [-1,1].forEach(d=>{ g.beginPath(); g.moveTo(cx+d*20*s,cy-4*s);
      g.quadraticCurveTo(cx+d*60*s,cy-30*s,cx+d*62*s,cy+6*s);
      g.lineTo(cx+d*44*s,cy); g.lineTo(cx+d*46*s,cy+20*s); g.lineTo(cx+d*30*s,cy+8*s);
      g.lineTo(cx+d*30*s,cy+24*s); g.lineTo(cx+d*18*s,cy+8*s); g.closePath(); g.fill(); });
    eye(g,cx-9*s,cy-2*s,6*s,3*s); eye(g,cx+9*s,cy-2*s,6*s,3*s);
    fang(g,cx-6*s,cy+12*s,3*s,7*s); fang(g,cx+6*s,cy+12*s,3*s,7*s); },

  esqueleto(g,cx,cy,s){ shadow(g,cx,cy,s); g.fillStyle="#eef0f2";
    g.beginPath(); g.arc(cx,cy-6*s,40*s,0,7); g.fill();
    g.fillRect(cx-22*s,cy+26*s,44*s,16*s);
    g.fillStyle="#1a1a1a"; g.beginPath(); g.ellipse(cx-15*s,cy-8*s,11*s,13*s,0,0,7); g.fill();
    g.beginPath(); g.ellipse(cx+15*s,cy-8*s,11*s,13*s,0,0,7); g.fill();
    g.beginPath(); g.moveTo(cx,cy+6*s); g.lineTo(cx-6*s,cy+16*s); g.lineTo(cx+6*s,cy+16*s); g.fill();
    g.strokeStyle="#cfd3d8"; g.lineWidth=2*s;
    for(let i=-1;i<=2;i++){ g.beginPath(); g.moveTo(cx-18*s+i*12*s,cy+26*s); g.lineTo(cx-18*s+i*12*s,cy+42*s); g.stroke(); } },

  bruxa(g,cx,cy,s){ shadow(g,cx,cy,s);
    g.fillStyle="#86d36b"; g.beginPath(); g.arc(cx,cy+6*s,34*s,0,7); g.fill();
    g.fillStyle="#58a33e"; g.beginPath(); g.moveTo(cx+8*s,cy+4*s); g.lineTo(cx+26*s,cy+16*s); g.lineTo(cx+8*s,cy+18*s); g.fill();
    g.fillStyle="#2a1140"; g.beginPath(); g.moveTo(cx-44*s,cy-18*s); g.lineTo(cx+44*s,cy-18*s); g.lineTo(cx,cy-74*s); g.closePath(); g.fill();
    g.fillStyle="#ff8a1e"; g.fillRect(cx-44*s,cy-24*s,88*s,10*s);
    g.fillStyle="#7a3b00"; // cabelo
    g.fillRect(cx-40*s,cy-16*s,10*s,40*s); g.fillRect(cx+30*s,cy-16*s,10*s,40*s);
    eye(g,cx-12*s,cy-2*s,7*s,4*s); eye(g,cx+12*s,cy-2*s,7*s,4*s);
    g.strokeStyle="#2a1140"; g.lineWidth=3*s; g.beginPath(); g.arc(cx,cy+18*s,10*s,0.1,Math.PI-0.1); g.stroke(); },

  gato(g,cx,cy,s){ shadow(g,cx,cy,s); g.fillStyle="#352049";
    g.beginPath(); g.moveTo(cx-30*s,cy-18*s); g.lineTo(cx-20*s,cy-50*s); g.lineTo(cx-6*s,cy-24*s); g.fill();
    g.beginPath(); g.moveTo(cx+30*s,cy-18*s); g.lineTo(cx+20*s,cy-50*s); g.lineTo(cx+6*s,cy-24*s); g.fill();
    g.beginPath(); g.arc(cx,cy,36*s,0,7); g.fill();
    g.fillStyle="#6ee86e"; g.beginPath(); g.ellipse(cx-13*s,cy-4*s,7*s,11*s,0,0,7); g.fill();
    g.beginPath(); g.ellipse(cx+13*s,cy-4*s,7*s,11*s,0,0,7); g.fill();
    g.fillStyle="#111"; g.fillRect(cx-15*s,cy-13*s,4*s,18*s); g.fillRect(cx+11*s,cy-13*s,4*s,18*s);
    g.fillStyle="#ff8a1e"; g.beginPath(); g.moveTo(cx,cy+8*s); g.lineTo(cx-5*s,cy+14*s); g.lineTo(cx+5*s,cy+14*s); g.fill();
    g.strokeStyle="#aaa"; g.lineWidth=1.5*s;
    [-1,1].forEach(d=>{ for(let i=0;i<3;i++){ g.beginPath(); g.moveTo(cx+d*8*s,cy+12*s+i*5*s); g.lineTo(cx+d*40*s,cy+6*s+i*8*s); g.stroke(); } }); },

  vampiro(g,cx,cy,s){ shadow(g,cx,cy,s);
    g.fillStyle="#1a1140"; g.beginPath(); g.moveTo(cx-40*s,cy+30*s); g.lineTo(cx-30*s,cy-10*s);
    g.lineTo(cx+30*s,cy-10*s); g.lineTo(cx+40*s,cy+30*s); g.closePath(); g.fill();
    g.fillStyle="#f0e4e4"; g.beginPath(); g.arc(cx,cy-4*s,32*s,0,7); g.fill();
    g.fillStyle="#140a22"; g.beginPath(); g.moveTo(cx-32*s,cy-18*s);
    g.lineTo(cx-4*s,cy-14*s); g.lineTo(cx,cy-26*s); g.lineTo(cx+4*s,cy-14*s); g.lineTo(cx+32*s,cy-18*s);
    g.lineTo(cx+30*s,cy-34*s); g.lineTo(cx-30*s,cy-34*s); g.fill();
    eye(g,cx-12*s,cy-2*s,6*s,3*s); eye(g,cx+12*s,cy-2*s,6*s,3*s);
    g.fillStyle="#b02030"; g.beginPath(); g.arc(cx,cy+14*s,9*s,0,Math.PI); g.fill();
    fang(g,cx-6*s,cy+14*s,2.5*s,8*s); fang(g,cx+6*s,cy+14*s,2.5*s,8*s); },

  zombie(g,cx,cy,s){ shadow(g,cx,cy,s);
    g.fillStyle="#7fae5a"; g.beginPath(); g.arc(cx,cy,36*s,0,7); g.fill();
    g.fillStyle="#5f8a3e"; g.beginPath(); g.arc(cx+22*s,cy-18*s,8*s,0,7); g.fill();
    eye(g,cx-13*s,cy-4*s,8*s,4*s,2*s);

/* ============================ GRAVAÇÃO / TROFÉUS ============================ */
const SAVE_KEY="halloween_trunfo_v1";
const TROPHIES=[
  {id:"first", ic:"🥇", t:"Primeira vitória", d:"Ganha o teu primeiro jogo"},
  {id:"five",  ic:"🏆", t:"Caçador de monstros", d:"Ganha 5 jogos"},
  {id:"pot",   ic:"💰", t:"Grande monte", d:"Leva um monte de 4+ cartas de uma vez"},
  {id:"comeback", ic:"🔥", t:"Virar o jogo", d:"Ganha depois de teres só 3 cartas ou menos"}
];
function loadSave(){ try{ return Object.assign({wins:0,trophies:{}}, JSON.parse(localStorage.getItem(SAVE_KEY)||"{}")); }catch(e){ return {wins:0,trophies:{}}; } }
function storeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
let save=loadSave();
let newTrophies=[];
function award(id){ if(!save.trophies[id]){ save.trophies[id]=true; newTrophies.push(id); storeSave(save); } }

/* ============================ ESTADO DO JOGO ============================ */
let you=[], bot=[], pot=[], chooser="you", phase="play", wasLow=false;
const $=id=>document.getElementById(id);

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function newGame(){
  const d=shuffle(DECK.slice());
  you=d.slice(0,8); bot=d.slice(8);
  pot=[]; chooser="you"; phase="play"; wasLow=false; newTrophies=[];
  show("game"); renderAll();
  $("msg").innerHTML="Escolhe um poder da tua carta!";
  $("hint").textContent="Toca num dos quatro poderes.";
}

/* ---------- desenho de uma carta num canvas ---------- */
function paint(canvas, card){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=canvas.clientWidth||220, h=canvas.clientHeight||120;
  canvas.width=w*dpr; canvas.height=h*dpr;
  const g=canvas.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  // fundo
  const grd=g.createLinearGradient(0,0,0,h); grd.addColorStop(0,"#2a123f"); grd.addColorStop(1,"#160a24");
  g.fillStyle=grd; g.fillRect(0,0,w,h);
  g.fillStyle="rgba(255,255,255,.04)"; for(let i=0;i<18;i++){ g.fillRect(Math.random()*w,Math.random()*h,2,2); }
  // brilho central para destacar os monstros (sobretudo os escuros)
  const halo=g.createRadialGradient(w/2,h*0.5,4,w/2,h*0.5,Math.max(w,h)*0.55);
  halo.addColorStop(0,"rgba(255,200,120,.28)"); halo.addColorStop(0.5,"rgba(154,92,255,.10)"); halo.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=halo; g.fillRect(0,0,w,h);
  const s=Math.min(w,h)/150;
  (ART[card.id]||ART.fantasminha)(g, w/2, h*0.52, s);
}

function renderAll(){
  $("youCt").textContent=you.length;
  $("botCt").textContent=bot.length;
  $("potCt").textContent=pot.length;
  // tua carta
  const yc=you[0];
  $("yName").textContent=yc?yc.name:"";
  if(yc) paint($("yArt"), yc);
  // atributos
  const box=$("attrs"); box.innerHTML="";
  ATTRS.forEach(a=>{
    const b=document.createElement("button"); b.className="attr";
    b.innerHTML=`<span class="em">${a.em}</span><span class="al"><span class="k">${a.label}</span><span class="v">${yc?yc[a.k]:"-"}</span></span>`;
    const canPick = phase==="play" && chooser==="you";
    b.disabled=!canPick;
    if(canPick) b.addEventListener("click",()=>playAttr(a.k));
    box.appendChild(b);
  });
  // bot
  renderBot(null,null,null);
}

function renderBot(card, attrKey, result){
  const z=$("botzone"); z.innerHTML="";
  const m=document.createElement("div"); m.className="minicard";
  if(!card){
    m.innerHTML=`<div class="back">🂠</div>`;
  }else{
    const cv=document.createElement("canvas"); cv.className="mini-art";
    const nm=document.createElement("div"); nm.className="mini-name"; nm.textContent=card.name;
    const rows=document.createElement("div"); rows.className="mini-rows";
    ATTRS.forEach(a=>{
      const r=document.createElement("div"); r.className="r"+(a.k===attrKey?" hit":"");
      r.innerHTML=`<span>${a.em} ${a.label}</span><b>${card[a.k]}</b>`; rows.appendChild(r);
    });
    m.appendChild(cv); m.appendChild(nm); m.appendChild(rows);
    if(result==="win") m.style.borderColor="var(--green)";
    else if(result==="lose") m.style.borderColor="var(--red)";
    else if(result==="tie") m.style.borderColor="var(--gold)";
    z.appendChild(m);
    requestAnimationFrame(()=>paint(cv, card)); // após estar no DOM (tem tamanho)
    return;
  }
  z.appendChild(m);
}

/* ---------- jogada ---------- */
function playAttr(k){
  if(phase!=="play") return;
  SFX.resume(); SFX.pick();
  resolve(k);
}
function botPlay(){
  const bc=bot[0]; if(!bc){ return; }
  // ordena os poderes do melhor para o pior
  const ranked=ATTRS.map(a=>a.k).sort((x,y)=>bc[y]-bc[x]);
  // 65% joga o melhor; 25% o 2.º melhor; 10% o 3.º (menos previsivel, mas justo)
  const r=Math.random();
  let best = r<0.65 ? ranked[0] : r<0.90 ? ranked[1] : ranked[2];
  // se o monte estiver grande, o bot joga a sério (vai ao melhor)
  if(pot.length>=2) best=ranked[0];
  const label=ATTRS.find(a=>a.k===best).label;
  $("msg").innerHTML=`👹 O bot escolhe <b>${label}</b>!`;
  SFX.pick();
  setTimeout(()=>resolve(best), 650);
}

function resolve(k){
  phase="reveal";
  const yc=you.shift(), bc=bot.shift();
  const yv=yc[k], bv=bc[k];
  const label=ATTRS.find(a=>a.k===k).label;
  const stake=pot.length;
  let result, msg;
  if(yv>bv){
    result="win"; you.push(yc,bc,...pot); pot=[]; chooser="you";
    if(stake+2>=4) award("pot");
    if(wasLow) award("comeback");
    SFX.win();
    msg=`<span class="win">Ganhaste! ${label} ${yv} &gt; ${bv}</span>`;
  }else if(bv>yv){
    result="lose"; bot.push(bc,yc,...pot); pot=[]; chooser="bot";
    SFX.lose();
    msg=`<span class="lose">O bot ganhou. ${label} ${bv} &gt; ${yv}</span>`;
  }else{
    result="tie"; pot.push(yc,bc); // mesmo jogador volta a escolher
    SFX.tie();
    msg=`<span class="tie">Empate em ${label} (${yv})! As cartas vão para o monte.</span>`;
  }
  if(you.length<=3) wasLow=true;
  $("youCt").textContent=you.length; $("botCt").textContent=bot.length; $("potCt").textContent=pot.length;
  // mostrar tua carta tambem marcada
  $("yName").textContent=yc.name; paint($("yArt"), yc);
  const box=$("attrs");
  Array.from(box.children).forEach((b,i)=>{ b.disabled=true; b.classList.toggle("pick", ATTRS[i].k===k); });
  renderBot(bc, k, result);
  $("msg").innerHTML=msg;
  // fim de jogo?
  if(you.length===0 || bot.length===0){
    setTimeout(endGame, 900); return;
  }
  // continuar
  $("bar").style.display="flex";
  $("hint").textContent = chooser==="you" ? "A seguir escolhes tu." :
                          result==="tie" ? "Empate: escolhes outra vez." : "A seguir escolhe o bot.";
}

$("contBtn").addEventListener("click",()=>{
  SFX.tap();
  $("bar").style.display="none";
  phase="play";
  // limpar marcas
  renderAll();
  if(chooser==="you"){
    $("msg").innerHTML="Escolhe um poder da tua carta!";
    $("hint").textContent="";
  }else{
    $("msg").innerHTML="👹 O bot está a pensar...";
    $("hint").textContent="";
    setTimeout(botPlay, 700);
  }
});

/* ---------- fim ---------- */
function endGame(){
  phase="over";
  const won = bot.length===0 && you.length>0;
  if(won){ save.wins=(save.wins||0)+1; storeSave(save); award("first"); if(save.wins>=5) award("five"); SFX.victory(); }
  else SFX.defeat();
  $("overEmo").textContent = won ? "🏆" : "👻";
  $("overTitle").textContent = won ? "Ganhaste!" : "Perdeste!";
  $("overSub").textContent = won
    ? "Apanhaste todos os monstros. És o Rei do Halloween!"
    : "O bot apanhou todas as cartas. Tenta outra vez!";
  const tro=$("overTro"); tro.innerHTML="";
  if(won && save.wins) { /* espaço para contagem */ }
  newTrophies.forEach(id=>{
    const t=TROPHIES.find(x=>x.id===id); if(!t) return;
    const d=document.createElement("div"); d.className="trb new"; d.innerHTML=`${t.ic} ${t.t}`; tro.appendChild(d);
  });
  if(newTrophies.length===0){
    const d=document.createElement("div"); d.className="trb";
    d.textContent = won ? ("Vitórias: "+save.wins) : "Sem troféus novos";
    tro.appendChild(d);
  }
  show("over");
}

});

$("muteBtn").addEventListener("click",()=>{ SFX.setOn(!SFX.isOn()); refreshMute(); if(SFX.isOn())SFX.tap(); });
$("muteBtn2").addEventListener("click",()=>{ SFX.setOn(!SFX.isOn()); refreshMute(); if(SFX.isOn())SFX.tap(); });

$("troBtn").addEventListener("click",()=>{
  SFX.tap(); const list=$("troList"); list.innerHTML="";
  TROPHIES.forEach(t=>{
    const got=!!save.trophies[t.id];
    const d=document.createElement("div"); d.className="ti"+(got?"":" locked");
    d.innerHTML=`<div class="ic">${got?t.ic:"🔒"}</div><div class="tx"><div class="t">${t.t}</div><div class="d">${t.d}</div></div>`;
    list.appendChild(d);
  });
  show("troScr");
});
$("troClose").addEventListener("click",()=>{ SFX.tap(); show("title"); });

refreshMute();
window.addEventListener("resize",()=>{ if($("game").classList.contains("on")) { const yc=you[0]; if(yc) paint($("yArt"),yc); } });
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
